<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tako ADE</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&family=Silkscreen&display=swap" rel="stylesheet" />
<style>
/* ============================================================
   DESIGN TOKENS — tweak these to iterate on the look quickly
   ============================================================ */
:root {
  --bg: #0d0c0e;
  --bg-glow-1: rgba(160, 50, 40, 0.28);
  --bg-glow-2: rgba(90, 30, 60, 0.22);
  --panel: rgba(22, 20, 23, 0.72);
  --panel-solid: #161417;
  --surface: rgba(255, 255, 255, 0.04);
  --surface-hover: rgba(255, 255, 255, 0.07);
  --surface-active: rgba(255, 255, 255, 0.10);
  --border: rgba(255, 255, 255, 0.07);
  --text: #ece9e6;
  --text-2: #a9a4a0;
  --text-3: #6f6a67;
  --accent: #e2795a;        /* agent spark / brand */
  --accent-2: #8a3a7a;
  --green: #5fc48a;
  --red: #e5675f;
  --yellow: #e2b75a;
  --blue: #7aa7e8;
  --radius: 10px;
  --radius-lg: 16px;
  --sidebar-w: 300px;
  --right-w: 340px;
  --rail-w: 52px;
  --font: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --composer-card: #1e1d20;
  --composer-foot: #141316;
  /* Empty-state backdrop: ember / plum glow in the app's accent family */
  --hero-1: rgba(255, 150, 110, .85);
  --hero-2: rgba(226, 121, 90, .70);
  --hero-3: rgba(170, 60, 90, .75);
  --hero-4: rgba(255, 200, 150, .55);
  --hero-5: rgba(110, 40, 60, .60);
  --hero-top: #5a2a28;
  --hero-mid: #3a1c22;
  --hero-bottom: #161417;
  --hero-fade: rgba(22, 20, 23, .95);
  --hero-h: clamp(560px, 78vh, 800px);
  --hero-ink: #f7efe8; --hero-sub: rgba(236, 228, 222, .62); --hero-shadow: rgba(0, 0, 0, .5);
  --hero-chip: rgba(28, 26, 30, .55); --hero-halo: rgba(226, 121, 90, .12);
}
:root[data-theme="light"] {
  --bg: #f5f2ef;
  --bg-glow-1: rgba(226, 121, 90, 0.18);
  --bg-glow-2: rgba(180, 120, 160, 0.14);
  --panel: rgba(255, 255, 255, 0.75);
  --panel-solid: #ffffff;
  --surface: rgba(0, 0, 0, 0.035);
  --surface-hover: rgba(0, 0, 0, 0.06);
  --surface-active: rgba(0, 0, 0, 0.09);
  --border: rgba(0, 0, 0, 0.08);
  --text: #1f1c1a;
  --text-2: #5b5652;
  --text-3: #9a948f;
  --composer-card: #ffffff;
  --composer-foot: #efebe7;
  --hero-1: rgba(255, 170, 130, .85);
  --hero-2: rgba(240, 140, 110, .60);
  --hero-3: rgba(220, 130, 160, .55);
  --hero-4: rgba(255, 215, 170, .70);
  --hero-5: rgba(230, 180, 170, .50);
  --hero-top: #f6c9b4;
  --hero-mid: #f1ddd2;
  --hero-bottom: #f5f2ef;
  --hero-fade: rgba(245, 242, 239, .95);
  --hero-ink: #2a1d22; --hero-sub: #6b5f5a; --hero-shadow: rgba(255, 255, 255, .6);
  --hero-chip: rgba(255, 255, 255, .6); --hero-halo: rgba(226, 121, 90, .10);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  font-size: 14px;
  color: var(--text);
  background:
    radial-gradient(900px 600px at 70% 35%, var(--bg-glow-1), transparent 70%),
    radial-gradient(700px 500px at 40% 90%, var(--bg-glow-2), transparent 70%),
    var(--bg);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
input, textarea { font: inherit; color: inherit; }
svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
code, .mono { font-family: var(--mono); font-size: 12.5px; }

/* ---------- Window chrome ---------- */
.app { display: grid; grid-template-rows: 1fr; height: 100vh; position: relative; }
/* Window chrome lives only above the rail + sidebar; the conversation and right panel run to the top edge */
.titlebar {
  position: absolute; top: 0; left: 0; z-index: 5; height: 44px; width: calc(var(--rail-w) + var(--sidebar-w));
  display: flex; align-items: center; gap: 12px; padding: 0 14px; transition: width .2s ease;
}
.app.no-sidebar .titlebar { width: auto; }
.app.is-empty .titlebar { width: 100%; }
.rail { padding-top: 54px !important; }
.sidebar { padding-top: 44px; }
.app.is-empty .main.empty { margin-top: 44px; }
.app.no-sidebar .main:not(.empty) .tabbar { padding-left: 150px; }
.tb-title { display: none !important; }
.tabbar .tb-right { margin-left: auto; padding-left: 12px; display: flex; align-items: center; gap: 2px; flex: none; background: none; }
.lights { display: flex; gap: 8px; }
.lights span { width: 12px; height: 12px; border-radius: 50%; }
.lights span:nth-child(1) { background: #ff5f57; }
.lights span:nth-child(2) { background: #febc2e; }
.lights span:nth-child(3) { background: #28c840; }
.tb-btn { padding: 6px; border-radius: 6px; color: var(--text-3); display: grid; place-items: center; }
.tb-btn:hover { background: var(--surface-hover); color: var(--text); }
.tb-title { display: flex; align-items: center; gap: 8px; font-weight: 500; margin-left: 120px; }
.tb-right { margin-left: auto; display: flex; gap: 4px; }

.spark { color: var(--accent); width: 15px; height: 15px; }

/* ---------- Layout ---------- */
.body {
  display: grid;
  grid-template-columns: var(--rail-w) var(--sidebar-w) 1fr var(--right-w);
  min-height: 0;
  transition: grid-template-columns .2s ease;
}
.app.no-sidebar .body { grid-template-columns: var(--rail-w) 0 1fr var(--right-w); }
.app.no-right .body { grid-template-columns: var(--rail-w) var(--sidebar-w) 1fr 0; }
.app.no-sidebar.no-right .body { grid-template-columns: var(--rail-w) 0 1fr 0; }
/* New-thread screen: no environment panel yet, backdrop fills the space */
.app.is-empty .body { grid-template-columns: var(--rail-w) 0 1fr 0; }
.app.is-empty .sidebar { visibility: hidden; border: 0; }
.app.is-empty .right { visibility: hidden; padding: 0; }
.app.is-empty .main.empty { margin: 44px 12px 12px 0; }

/* Rail */
.rail { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 0; }
.rail-btn { width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center; color: var(--text-3); }
.rail-btn svg { width: 19px; height: 19px; }
.rail-btn:hover { background: var(--surface-hover); color: var(--text); }
.rail-btn.active { background: var(--surface-active); color: var(--text); }
.rail .grow { flex: 1; }
.avatar { width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent-2)); display: grid; place-items: center; font-size: 12px; font-weight: 600; color: #fff; }
.agent-ring { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--green); display: grid; place-items: center; box-shadow: 0 0 12px rgba(95,196,138,.35); }

/* Sidebar */
.sidebar {
  overflow: hidden; border-right: 1px solid var(--border);
  display: flex; flex-direction: column; min-width: 0;
}
.sb-head { display: flex; align-items: center; padding: 14px 16px 6px; gap: 6px; }
.workspace { font-weight: 600; font-size: 17px; display: flex; align-items: center; gap: 4px; }
.sb-head .tb-btn:first-of-type { margin-left: auto; }
.np-scrim { position: fixed; inset: 0; z-index: 400; display: grid; place-items: center; background: rgba(0,0,0,.32); opacity: 0; transition: opacity .18s ease; }
.np-scrim.in { opacity: 1; } .np-scrim[hidden] { display: none; }
.np { width: min(520px, calc(100vw - 32px)); background: var(--panel-solid); border: 1px solid var(--border); border-radius: 14px; box-shadow: 0 24px 60px rgba(0,0,0,.3); padding: 16px 18px 14px; transform: translateY(8px) scale(.98); transition: transform .22s cubic-bezier(.2,.8,.2,1); }
.np-scrim.in .np { transform: none; }
.np-h { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; } .np-h b { font-size: 15px; font-weight: 600; }
.np-src { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
.np-src button { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--border); text-align: left; color: var(--text-2); }
.np-src button:hover { background: var(--surface-hover); }
.np-src button.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); color: var(--text); }
.np-src svg { width: 16px; height: 16px; } .np-src button.on svg { color: var(--accent); }
.np-src b { display: block; font-size: 12.5px; font-weight: 600; color: var(--text); } .np-src small { display: block; font-size: 11px; color: var(--text-3); margin-top: 2px; line-height: 1.35; }
.np-f { display: block; margin-bottom: 12px; } .np-f > span { display: block; font-size: 12px; color: var(--text-2); margin-bottom: 6px; }
.np-in { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 4px 0 10px; border-radius: 9px; border: 1px solid var(--border); background: var(--surface); }
.np-in:focus-within { border-color: color-mix(in srgb, var(--accent) 60%, var(--border)); }
.np-in > svg { width: 15px; height: 15px; color: var(--text-3); flex: none; }
.np-in input { flex: 1; min-width: 0; height: 100%; background: none; border: 0; outline: 0; font-size: 13px; color: var(--text); font-family: var(--mono, inherit); }
.np-ic { width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; margin-left: -4px; } .np-ic:hover { background: var(--surface-hover); }
.np-ic .pix { width: 16px; height: 16px; }
.np-pick { margin: -4px 0 12px; position: static; }
.np-lbs { display: flex; flex-wrap: wrap; gap: 6px; }
.np-lbs button { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--border); font-size: 12px; color: var(--text-2); }
.np-lbs button.on { border-color: var(--text-3); color: var(--text); background: var(--surface-active); }
.np-lbs i { width: 8px; height: 8px; border-radius: 2px; background: var(--c); }
.np-foot { display: flex; align-items: center; gap: 8px; padding-top: 12px; border-top: 1px solid var(--border); }
.np-foot small { flex: 1; font-size: 11.5px; color: var(--text-3); }
.np-foot .primary { background: var(--accent); color: var(--accent-ink, #fff); border-color: transparent; } .np-foot .primary:disabled { opacity: .45; cursor: default; }
.pj-new > .pj-h { animation: pjNew 1.6s ease; } @keyframes pjNew { 0%, 40% { background: color-mix(in srgb, var(--accent) 18%, transparent); } 100% { background: transparent; } }
.sb-grow { display: flex; align-items: center; margin-right: 8px; } .sb-grow .sb-group { flex: 1; min-width: 0; margin-right: 2px; }
.sb-selbtn { width: 28px; height: 28px; color: var(--text-3); } .sb-selbtn.on { color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
.wt { position: relative; }
.selecting .wt { padding-left: 38px; }
.wt-ck { position: absolute; left: 13px; top: 50%; translate: 0 -50%; width: 16px; height: 16px; border-radius: 5px; border: 1.5px solid var(--text-3); display: grid; place-items: center; color: transparent; transition: background .12s, border-color .12s; }
.wt-ck svg { width: 11px; height: 11px; stroke-width: 3; }
.wt.sel { background: color-mix(in srgb, var(--accent) 11%, transparent); }
.wt.sel .wt-ck { background: var(--accent); border-color: var(--accent); color: #fff; }
.pj-all { font-size: 11px; color: var(--accent); padding: 1px 6px; border-radius: 5px; } .pj-all:hover { background: var(--surface-hover); }
.sb-batch { display: flex; align-items: center; gap: 2px; margin: 0 8px 10px; padding: 6px 6px 6px 12px; border-radius: 10px; background: var(--panel-solid); border: 1px solid var(--border); box-shadow: 0 8px 24px rgba(0,0,0,.18); animation: sbIn .2s cubic-bezier(.2,.8,.2,1); flex: none; }
.sb-batch[hidden] { display: none; }
@keyframes sbIn { from { opacity: 0; transform: translateY(6px); } }
.sb-bn { flex: 1; min-width: 0; font-size: 12.5px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sb-batch .ib { width: 28px; height: 28px; color: var(--text-2); } .sb-batch .ib:hover:not(:disabled) { color: var(--text); background: var(--surface-hover); }
.sb-batch .ib:disabled { opacity: .35; cursor: default; } .sb-batch .ib svg { width: 15px; height: 15px; }
.sb-bsep { width: 1px; height: 16px; background: var(--border); margin: 0 3px; }
.sb-ba { height: 26px; padding: 0 10px; border-radius: 7px; font-size: 12px; font-weight: 600; color: var(--accent); } .sb-ba:hover { background: var(--surface-hover); }
.sb-ba.danger { background: var(--red, #e5675f); color: #fff; } .sb-batch:not(.snack) .sb-bn { color: var(--text); font-weight: 500; }
.sb-row { display: flex; align-items: center; gap: 10px; padding: 8px 12px; margin: 0 8px; border-radius: 8px; color: var(--text); white-space: nowrap; }
.sb-row:hover { background: var(--surface-hover); }
.sb-row.muted { color: var(--text-2); }
.sb-search { margin: 4px 16px 8px; display: none; }
.sb-search.open { display: block; }
.sb-search input { width: 100%; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); outline: none; }
.threads { overflow-y: auto; flex: 1; padding-bottom: 16px; }
.group-label { color: var(--text-3); font-size: 12.5px; padding: 16px 20px 6px; }
.thread { margin: 2px 8px; padding: 9px 12px; border-radius: 10px; cursor: pointer; min-width: 0; }
.thread:hover { background: var(--surface-hover); }
.thread.active { background: var(--surface-active); }
.thread-title { display: flex; align-items: center; gap: 8px; font-weight: 450; }
.thread-title span.t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.thread-meta { display: flex; align-items: center; gap: 8px; margin-top: 5px; font-size: 12.5px; color: var(--text-2); white-space: nowrap; overflow: hidden; }
.thread-meta svg { width: 12px; height: 12px; color: var(--text-3); }
.repo-badge { width: 14px; height: 14px; border-radius: 3px; background: var(--text); color: var(--bg); font-size: 9px; font-weight: 700; display: grid; place-items: center; }
.pr { color: var(--green); }
.pr.draft { color: var(--text-3); }
.pr.merged { color: #b48ae8; }
.branch { overflow: hidden; text-overflow: ellipsis; color: var(--text-3); }
.spinner { width: 13px; height: 13px; border: 1.6px solid var(--text-3); border-top-color: transparent; border-radius: 50%; animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }

/* Main conversation */
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.transcript { flex: 1; overflow-y: auto; padding: 28px 0 40px; scroll-behavior: smooth; }
.col { max-width: 760px; margin: 0 auto; padding: 0 32px; }
.msg-user { display: flex; flex-direction: column; align-items: flex-end; margin: 22px 0 28px; }
.msg-user .bubble {
  background: var(--surface-active); border: 1px solid var(--border);
  padding: 12px 18px; border-radius: 14px; max-width: 85%; line-height: 1.6;
}
.steer { color: var(--text-2); font-size: 13px; display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
.prose { line-height: 1.7; margin: 14px 0; color: var(--text); }
.prose code { background: var(--surface-active); padding: 1px 6px; border-radius: 5px; }
.tool {
  display: flex; align-items: center; gap: 10px; color: var(--text-2);
  padding: 6px 8px; margin: 4px -8px; border-radius: 8px; cursor: pointer; user-select: none;
}
.tool:hover { background: var(--surface); color: var(--text); }
.tool .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.tool .chev { transition: transform .15s; color: var(--text-3); }
.tool.open .chev { transform: rotate(90deg); }
.tool-body {
  display: none; margin: 2px 0 10px 26px; padding: 12px 14px;
  background: rgba(0,0,0,.28); border: 1px solid var(--border); border-radius: 10px;
  font-family: var(--mono); font-size: 12px; line-height: 1.65; color: var(--text-2);
  white-space: pre-wrap; overflow-x: auto;
}
:root[data-theme="light"] .tool-body { background: rgba(0,0,0,.04); }
.tool.open + .tool-body { display: block; }
.tool-body .ok { color: var(--green); }
.tool-body .err { color: var(--red); }
.tool-body .cmd { color: var(--text); }
.thinking { color: var(--text-3); display: flex; gap: 10px; align-items: center; padding: 6px 0; }
.thinking .shimmer {
  background: linear-gradient(90deg, var(--text-3) 0%, var(--text) 50%, var(--text-3) 100%);
  background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: shimmer 1.6s linear infinite;
}
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

/* Composer — two-tier: input card on top, context strip below */
.composer-wrap { padding: 0 0 16px; }
.composer {
  background: var(--composer-foot); border: 1px solid var(--border); border-radius: 20px;
  box-shadow: 0 20px 60px rgba(0,0,0,.35); overflow: hidden;
}
.composer-card {
  background: var(--composer-card); border-radius: 20px; padding: 14px 12px 12px 16px;
  box-shadow: 0 1px 0 var(--border);
}
.composer textarea {
  width: 100%; resize: none; border: 0; outline: none; background: transparent;
  line-height: 1.5; min-height: 44px; max-height: 200px; padding: 2px 4px 0; font-size: 15px;
}
.composer textarea::placeholder { color: var(--text-3); }
.composer-actions { display: flex; align-items: center; gap: 6px; margin-top: 10px; }
.composer-actions .grow { flex: 1; }
.icon-btn { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: var(--text-2); }
.icon-btn:hover { background: var(--surface-hover); color: var(--text); }
.icon-btn.ring { background: var(--surface-active); color: var(--text); }
.icon-btn.ring svg { width: 18px; height: 18px; }
.send { background: var(--surface-active); color: var(--text-3); transition: background .15s, color .15s; }
.send.ready, .send.stopping { background: var(--text); color: var(--bg); }
.send.ready:hover { background: var(--text); color: var(--bg); opacity: .9; }
.send .stop { width: 10px; height: 10px; background: currentColor; border-radius: 2px; }
.composer-foot { display: flex; align-items: center; gap: 4px; padding: 7px 10px; font-size: 13px; white-space: nowrap; overflow: hidden; }
.composer-foot .sep { color: var(--text-3); display: grid; place-items: center; }
.composer-foot .sep svg { width: 12px; height: 12px; }
.composer-foot .spacer { flex: 1; min-width: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 7px; border-radius: 7px; color: var(--text-2); }
.chip svg { width: 14px; height: 14px; }
.chip:hover { background: var(--surface-hover); color: var(--text); }
.chip b { font-weight: 500; color: var(--text); }
.chip .faint { color: var(--text-3); }
.ctx-ring { width: 14px; height: 14px; border-radius: 50%; background: conic-gradient(var(--text-2) var(--ctx, 30%), var(--surface-active) 0); -webkit-mask: radial-gradient(circle, transparent 4.5px, #000 5px); mask: radial-gradient(circle, transparent 4.5px, #000 5px); }

/* Empty state — centered composer over an aurora backdrop */
.main { position: relative; }
.hero-bg { display: none; }
.main.empty { margin: 0 12px 12px 0; border-radius: var(--radius-lg); display: block; overflow-y: auto; overflow-x: hidden; background: var(--bg); }
.main.empty .hero-bg {
  display: block; position: absolute; top: 0; left: 0; right: 0; height: var(--hero-h); z-index: 0; background: var(--bg);
}
.main.empty .hero-bg::after { /* melt the hero into the dashboard below */
  content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none;
  background: linear-gradient(180deg, transparent 72%, var(--bg));
}
/* Three backdrops, one canvas each; the active one fades in */
.hero-bg canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; opacity: 0; transition: opacity .6s ease; }
#main[data-hero="dots"] #heroCanvas, #main[data-hero="ascii"] #asciiCanvas, #main[data-hero="pixel"] #pixelCanvas, #main[data-hero="molten"] #moltenCanvas { opacity: 1; }

/* Molten: tight chrome headline + frosted-glass composer over liquid metal */
#main[data-hero="molten"] .hero-head h1 {
  font-family: var(--font); font-weight: 600; letter-spacing: -0.045em; font-size: clamp(34px, 4vw, 54px); line-height: 1.02;
  white-space: nowrap; margin: 0 -60px; filter: drop-shadow(0 4px 24px var(--hero-shadow));
  background: linear-gradient(180deg, var(--hero-ink) 35%, color-mix(in srgb, var(--hero-ink) 50%, transparent));
  -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none;
}
#main[data-hero="molten"] .hero-head h1 em {
  font-style: normal; background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 45%, #fff), var(--accent) 30%, var(--accent-2) 55%, #7aa7e8 75%, color-mix(in srgb, var(--accent) 45%, #fff));
  background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;

/* Frosted-glass composer on every backdrop */

}

#pixelCanvas { image-rendering: pixelated; image-rendering: crisp-edges; }
#main[data-hero="pixel"] .hero-head, #main[data-hero="pixel"] .hero-chips { display: none !important; }

.hero-head .prompt { color: var(--accent); margin-right: .45em; }

.hero-switch { display: none; }

  display: flex; position: absolute; top: 14px; right: 14px; z-index: 3; gap: 2px; padding: 3px;
  border-radius: 10px; background: var(--hero-chip); border: 1px solid var(--border); backdrop-filter: blur(14px);
  animation: rise 1s .2s cubic-bezier(.2,.8,.2,1) both;
}

.hero-switch button:hover { color: var(--text); }
.hero-switch button.active { background: var(--surface-active); color: var(--text); }
.hero-switch svg { width: 14px; height: 14px; }
/* Pixel scenes: second row of pills + a one-line caption */
.scene-switch { display: none; }
#main.empty[data-hero="pixel"] .scene-switch { display: flex; position: absolute; top: 14px; right: 14px; z-index: 3; align-items: center; gap: 12px; animation: rise .7s cubic-bezier(.2,.8,.2,1) both; }
.scene-switch .pills { display: flex; gap: 2px; padding: 3px; border-radius: 10px; background: var(--hero-chip); border: 1px solid var(--border); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
.scene-switch button { display: flex; align-items: center; gap: 7px; padding: 4px 10px 4px 7px; border-radius: 7px; font-size: 12px; color: var(--hero-sub); transition: background .2s, color .2s; }
.scene-switch button:hover { color: var(--text); }

.scene-switch .cap { font-size: 12px; color: var(--hero-sub); padding: 5px 11px; border-radius: 999px; background: var(--hero-chip); border: 1px solid var(--border); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
.scene-switch .cap.in { animation: capIn .9s cubic-bezier(.2,.8,.2,1) both; }
@keyframes capIn { from { opacity: 0; transform: translateX(8px); filter: blur(4px); } }
@media (max-width: 760px) { .scene-switch .cap { display: none; } }
.main.empty .transcript { display: none; }
/* Chats: the Home backdrop lingers as a quiet, blurred wash at the top — a frozen frame, never animated */
.main:not(.empty) { overflow: hidden; }
.main:not(.empty) > .transcript, .main:not(.empty) > .composer-wrap { position: relative; z-index: 1; }
.main:not(.empty) .hero-bg {
  display: block; position: absolute; top: 0; left: 0; right: 0; height: min(var(--hero-h), 50%); z-index: 0; pointer-events: none;
  opacity: .32; filter: blur(40px) saturate(1.3); transform: scale(1.15); transform-origin: top center;
  -webkit-mask: linear-gradient(180deg, #000 0%, rgba(0,0,0,.4) 35%, transparent 85%); mask: linear-gradient(180deg, #000 0%, rgba(0,0,0,.4) 35%, transparent 85%);
  animation: ambIn 1.2s ease both;
}

@keyframes ambIn { from { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .main:not(.empty) .hero-bg { animation: none; } }
.main.empty .composer-wrap { position: relative; z-index: 2; min-height: var(--hero-h); display: flex; align-items: center; padding: 56px 0 72px; }
.main.empty .col { max-width: 760px; width: 100%; }

/* Hero: serif headline, suggestion chips, cursor-tracked composer glow */
.hero-head, .hero-chips { display: none; }
.main.empty .hero-head { display: block; text-align: center; margin-bottom: 28px; animation: rise 1s cubic-bezier(.2,.8,.2,1) both; }
.hero-head h1 { font-family: "Instrument Serif", Georgia, serif; font-weight: 400; font-size: clamp(36px, 4.4vw, 58px); line-height: 1.04; letter-spacing: -0.01em; color: var(--hero-ink); text-shadow: 0 2px 40px var(--hero-shadow); }
.hero-head h1 em { color: var(--accent); }
.hero-head p { margin: 14px auto 0; max-width: 470px; color: var(--hero-sub); line-height: 1.55; font-size: 14.5px; }
.main.empty .composer { position: relative; animation: rise 1s .08s cubic-bezier(.2,.8,.2,1) both; box-shadow: 0 30px 80px rgba(0,0,0,.45), 0 0 80px var(--hero-halo); }
.main.empty .composer::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none;
  background: radial-gradient(240px circle at var(--cx, 50%) var(--cy, 0%), var(--accent), transparent 70%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude;
  opacity: var(--co, .3); transition: opacity .4s;
}

.hero-chips button { padding: 7px 13px; border-radius: 999px; font-size: 13px; color: var(--hero-sub); background: var(--hero-chip); border: 1px solid var(--border); backdrop-filter: blur(12px); transition: color .2s, border-color .2s, transform .25s cubic-bezier(.2,.8,.2,1); }
.hero-chips button:hover { color: var(--text); border-color: color-mix(in srgb, var(--accent) 55%, transparent); transform: translateY(-2px); }
@keyframes rise { from { opacity: 0; transform: translateY(16px); filter: blur(8px); } to { opacity: 1; transform: none; filter: none; } }
@media (prefers-reduced-motion: reduce) { .main.empty .hero-head, .main.empty .composer, .main.empty .hero-chips { animation: none; } }

/* ============================================================
   HOME DASHBOARD
   ============================================================ */
.dash { display: none; }
.main.empty .dash { display: block; position: relative; z-index: 2; max-width: 760px; margin: -8px auto 0; padding: 0 32px 120px; }
.dash-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.dash-head h2 { font-size: 24px; font-weight: 600; letter-spacing: -0.03em; }

.dash-head p b { color: var(--text); font-weight: 500; }
.seg { display: flex; padding: 3px; gap: 2px; border-radius: 10px; background: var(--surface); border: 1px solid var(--border); }
.seg button { padding: 5px 11px; border-radius: 7px; font-size: 12.5px; color: var(--text-2); transition: background .2s, color .2s; }
.seg button.on { background: var(--surface-active); color: var(--text); }
.kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; margin-bottom: 12px; }
.dgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.card {
  background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 16px 18px; min-width: 0;
  -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
  opacity: 0; transform: translateY(16px);
  transition: opacity .8s cubic-bezier(.2,.8,.2,1), transform .8s cubic-bezier(.2,.8,.2,1), border-color .25s;
  transition-delay: calc(var(--i, 0) * 55ms);
}

.card:hover { border-color: color-mix(in srgb, var(--accent) 28%, var(--border)); }
.span2 { grid-column: span 2; }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; font-size: 12.5px; color: var(--text-2); }
.card-h b { color: var(--text); font-weight: 600; font-size: 14px; letter-spacing: -0.01em; }
.muted { color: var(--text-3); font-size: 12.5px; }

/* KPI cards */
.kpi { padding: 14px 16px 12px; position: relative; overflow: hidden; }
.kpi-top { display: flex; justify-content: space-between; align-items: center; font-size: 12.5px; color: var(--text-2); gap: 6px; }

.delta { font-size: 11.5px; font-weight: 500; padding: 2px 6px; border-radius: 6px; }

.delta.down { color: var(--red); background: color-mix(in srgb, var(--red) 12%, transparent); }
.live { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--green); }
.live i, .pulse { width: 6px; height: 6px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 0 color-mix(in srgb, var(--green) 60%, transparent); animation: pulse 1.8s infinite; display: inline-block; }
@keyframes pulse { 70% { box-shadow: 0 0 0 7px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
.sparkline { display: block; width: 100%; height: 30px; overflow: visible; }
.sparkline .ln { fill: none; stroke: var(--accent); stroke-width: 1.6; stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset 1.6s cubic-bezier(.4,0,.2,1) .3s; vector-effect: non-scaling-stroke; }

.meter { height: 6px; border-radius: 4px; background: var(--surface-active); overflow: hidden; margin: 12px 0 11px; }
.meter i { display: block; height: 100%; width: 0; border-radius: 4px; background: linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 50%, #fff)); transition: width 1.6s cubic-bezier(.2,.8,.2,1) .3s; }
.card.in .meter i { width: var(--w); }

/* Heatmap */
.hm-wrap { position: relative; }
.hm-months { position: relative; height: 16px; font-size: 11px; color: var(--text-3); }
.hm-months span { position: absolute; top: 0; }
.hm { display: grid; grid-template-columns: repeat(53, 1fr); grid-template-rows: repeat(7, auto); grid-auto-flow: column; gap: 3px; }
.hm i { aspect-ratio: 1; border-radius: 2.5px; background: var(--surface-active); opacity: 0; transform: scale(.4); transition: opacity .5s ease, transform .5s cubic-bezier(.2,.8,.2,1); transition-delay: calc(var(--d) * 9ms + 200ms); }
.card.in .hm i { opacity: 1; transform: none; }

.l1 { background: color-mix(in srgb, var(--accent) 28%, var(--surface-active)) !important; }

.l3 { background: color-mix(in srgb, var(--accent) 78%, var(--surface-active)) !important; }
.l4 { background: color-mix(in srgb, var(--accent) 50%, #fff) !important; box-shadow: 0 0 6px color-mix(in srgb, var(--accent) 60%, transparent); }
.hm-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; font-size: 11.5px; color: var(--text-3); gap: 12px; flex-wrap: wrap; }
.hm-stats { display: flex; gap: 18px; }
.hm-stats b { color: var(--text); font-weight: 600; }
.legend { display: flex; align-items: center; gap: 3px; }
.legend i { width: 10px; height: 10px; border-radius: 2px; background: var(--surface-active); }
.dash-tip {
  position: fixed; z-index: 50; pointer-events: none; padding: 6px 9px; border-radius: 8px; font-size: 12px;
  background: var(--panel-solid); border: 1px solid var(--border); color: var(--text); box-shadow: 0 8px 24px rgba(0,0,0,.35);
  opacity: 0; transform: translate(-50%, -100%) translateY(-6px); transition: opacity .12s; white-space: nowrap;
}
.dash-tip.show { opacity: 1; }

/* Live agents */
.agent { padding: 10px 0; border-top: 1px solid var(--border); }
.agent:first-child { border-top: 0; padding-top: 0; }
.ag-top { display: flex; align-items: center; gap: 8px; font-size: 13.5px; cursor: pointer; }
.ag-top .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ag-top .tm { font-family: var(--mono); font-size: 11.5px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.ag-step { font-size: 12px; color: var(--text-2); margin: 4px 0 8px 14px; transition: opacity .25s; }
