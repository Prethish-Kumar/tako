.prog { height: 3px; border-radius: 3px; background: var(--surface-active); overflow: hidden; margin-left: 14px; }
.prog i { display: block; height: 100%; width: 100%; transform-origin: left; transform: scaleX(0); background: linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 50%, #fff)); border-radius: 3px; }
.agent.done .prog i { background: var(--green); }
.agent.done .ag-step { color: var(--green); }
.events { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); display: grid; gap: 8px; }
.ev { display: flex; gap: 8px; font-size: 12px; color: var(--text-2); align-items: baseline; }
.ev .when { margin-left: auto; color: var(--text-3); flex-shrink: 0; }
.ev .c { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; transform: translateY(-1px); }

/* PR list */
.tabs { display: flex; gap: 2px; }
.tabs button { padding: 4px 9px; border-radius: 7px; font-size: 12px; color: var(--text-2); display: flex; gap: 5px; align-items: center; transition: background .2s, color .2s; }
.tabs button span { color: var(--text-3); font-variant-numeric: tabular-nums; }
.tabs button.on { background: var(--surface-active); color: var(--text); }
.pr-row { display: flex; align-items: center; gap: 12px; padding: 10px 8px; margin: 0 -8px; border-radius: 10px; cursor: pointer; animation: rowIn .45s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--k) * 35ms); }
.pr-row:hover { background: var(--surface-hover); }
@keyframes rowIn { from { opacity: 0; transform: translateY(6px); } }
.pr-ic { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; flex-shrink: 0; background: var(--surface); }
.pr-ic.pass { color: var(--green); } .pr-ic.fail { color: var(--red); } .pr-ic.running { color: var(--yellow); }
.pr-main { flex: 1; min-width: 0; }
.pr-title { font-size: 13.5px; display: flex; align-items: center; gap: 8px; min-width: 0; }
.pr-title > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pr-meta { font-size: 12px; color: var(--text-3); margin-top: 3px; display: flex; gap: 6px; flex-wrap: wrap; }
.pr-meta .ok { color: var(--green); } .pr-meta .bad { color: var(--red); } .pr-meta .run { color: var(--yellow); }
.tag { font-size: 10.5px; font-weight: 600; padding: 2px 7px; border-radius: 999px; white-space: nowrap; flex-shrink: 0; }
.tag.quick { color: color-mix(in srgb, var(--accent) 40%, #fff); background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 35%, transparent), color-mix(in srgb, var(--accent-2) 30%, transparent)); border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); }
:root[data-theme="light"] .tag.quick { color: color-mix(in srgb, var(--accent) 65%, #000); }
.pr-diff { display: flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 11.5px; flex-shrink: 0; }
.pr-diff .a { color: var(--green); } .pr-diff .d { color: var(--red); }
.blocks { display: flex; gap: 2px; margin-left: 2px; }
.blocks i { width: 7px; height: 7px; border-radius: 1.5px; background: var(--surface-active); }
.blocks i.a { background: var(--green); } .blocks i.d { background: var(--red); }

/* Quick wins */
.qw { display: flex; align-items: center; gap: 10px; padding: 10px 12px; margin-top: 8px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border); overflow: hidden; transition: opacity .35s, transform .45s cubic-bezier(.2,.8,.2,1), max-height .45s ease .15s, margin .45s ease .15s, padding .45s ease .15s; max-height: 80px; }
.qw.gone { opacity: 0; transform: translateX(30px); max-height: 0; margin-top: 0; padding-top: 0; padding-bottom: 0; }
.qw > div { flex: 1; min-width: 0; }
.qw-t { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.qw-m { font-size: 11.5px; color: var(--text-3); margin-top: 3px; font-family: var(--mono); }
.qw-btn, .cbtn, .assign { font-size: 12px; font-weight: 500; padding: 6px 11px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-active); white-space: nowrap; transition: background .2s, border-color .2s, color .2s, transform .15s; display: inline-flex; align-items: center; gap: 6px; }
.qw-btn:hover, .cbtn:hover, .assign:hover { border-color: color-mix(in srgb, var(--accent) 55%, transparent); }
.qw-btn:active, .cbtn:active, .assign:active { transform: scale(.96); }
.qw-btn.ok, .cbtn.on { color: var(--green); background: color-mix(in srgb, var(--green) 12%, transparent); border-color: color-mix(in srgb, var(--green) 35%, transparent); }
.zero { text-align: center; padding: 26px 8px; color: var(--text-2); font-size: 13px; animation: rowIn .5s both; }
.zero b { display: block; font-size: 22px; margin-bottom: 4px; }

/* Throughput bars */
.bars { display: flex; align-items: flex-end; gap: 5px; height: 120px; }
.bar-c { flex: 1; height: 100%; display: flex; align-items: flex-end; position: relative; }
.bar-c i { width: 100%; height: 0; border-radius: 4px 4px 2px 2px; background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 50%, #fff), var(--accent) 60%, color-mix(in srgb, var(--accent) 50%, transparent)); transition: height 1.1s cubic-bezier(.2,.8,.2,1); transition-delay: calc(var(--i) * 40ms + 250ms); }
.bar-c:last-child i { box-shadow: 0 0 14px color-mix(in srgb, var(--accent) 70%, transparent); }
.card.in .bar-c i { height: var(--h); }
.bar-c:hover i { filter: brightness(1.25); }
.bars-x { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-3); margin-top: 8px; }
.tp-big { font-size: 26px; font-weight: 600; letter-spacing: -0.04em; margin: -4px 0 12px; }
.tp-big small { font-size: 12.5px; color: var(--green); font-weight: 500; margin-left: 6px; letter-spacing: 0; }

/* Issue inbox + integrations */
.issue { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--border); animation: rowIn .45s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--k) * 45ms); }
.issue:first-child { border-top: 0; padding-top: 0; }
.issue > div { flex: 1; min-width: 0; }
.is-t { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.is-m { font-size: 11.5px; color: var(--text-3); margin-top: 3px; display: flex; gap: 6px; align-items: center; }
.pri { display: inline-flex; gap: 1.5px; align-items: flex-end; height: 9px; }
.pri i { width: 2.5px; background: var(--text-3); border-radius: 1px; }
.pri i:nth-child(1) { height: 4px; } .pri i:nth-child(2) { height: 6.5px; } .pri i:nth-child(3) { height: 9px; }
.pri.p1 i { background: var(--red); } .pri.p2 i:nth-child(-n+2) { background: var(--yellow); } .pri.p3 i:nth-child(1) { background: var(--text-2); }
.mono { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: #fff; flex-shrink: 0; background: linear-gradient(135deg, var(--c), color-mix(in srgb, var(--c) 55%, #000)); box-shadow: inset 0 1px 0 rgba(255,255,255,.2); }
.mono.sm { width: 18px; height: 18px; border-radius: 5px; font-size: 9px; }
.integ-row { display: flex; align-items: center; gap: 11px; padding: 8px 0; }
.integ-row > div { flex: 1; min-width: 0; }
.it { font-size: 13.5px; }
.im { font-size: 11.5px; color: var(--text-3); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cbtn .spin { width: 11px; height: 11px; border: 1.6px solid currentColor; border-top-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; }
.empty-in { text-align: center; padding: 18px 6px; color: var(--text-2); font-size: 13px; line-height: 1.55; }
.empty-in .mono-row { display: flex; justify-content: center; gap: 6px; margin-bottom: 10px; }

.toast {
  position: fixed; left: 50%; bottom: 28px; z-index: 60; transform: translate(-50%, 20px); opacity: 0;
  padding: 10px 16px; border-radius: 12px; font-size: 13px; background: var(--panel-solid); border: 1px solid var(--border);
  box-shadow: 0 16px 40px rgba(0,0,0,.4); transition: opacity .3s, transform .4s cubic-bezier(.2,.8,.2,1); display: flex; gap: 8px; align-items: center;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast svg { color: var(--green); }

@media (max-width: 1240px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 1050px) { .dgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .dgrid .span2 { grid-column: span 2; } }
@media (max-width: 720px) { .dgrid { grid-template-columns: 1fr; } .dgrid .span2 { grid-column: auto; } .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } .main.empty .dash { padding: 0 16px 48px; } }
@media (prefers-reduced-motion: reduce) { .card, .hm i, .bar-c i, .pr-row, .issue { transition: none !important; animation: none !important; } }


/* ============================================================
   THEME — animated tokens + picker popover
   ============================================================ */
@property --bg { syntax: "<color>"; inherits: true; initial-value: #0d0c0e; }
@property --panel-solid { syntax: "<color>"; inherits: true; initial-value: #161417; }
@property --panel { syntax: "<color>"; inherits: true; initial-value: transparent; }
@property --composer-card { syntax: "<color>"; inherits: true; initial-value: #1e1d20; }
@property --composer-foot { syntax: "<color>"; inherits: true; initial-value: #141316; }
@property --text { syntax: "<color>"; inherits: true; initial-value: #ece9e6; }
@property --text-2 { syntax: "<color>"; inherits: true; initial-value: #a9a4a0; }
@property --text-3 { syntax: "<color>"; inherits: true; initial-value: #6f6a67; }
@property --accent { syntax: "<color>"; inherits: true; initial-value: #e2795a; }
@property --accent-2 { syntax: "<color>"; inherits: true; initial-value: #8a3a7a; }
@property --bg-glow-1 { syntax: "<color>"; inherits: true; initial-value: transparent; }
@property --bg-glow-2 { syntax: "<color>"; inherits: true; initial-value: transparent; }
@property --hero-chip { syntax: "<color>"; inherits: true; initial-value: transparent; }
@property --hero-ink { syntax: "<color>"; inherits: true; initial-value: #f7efe8; }
@property --hero-halo { syntax: "<color>"; inherits: true; initial-value: transparent; }
:root { transition: --bg .9s ease, --panel-solid .9s ease, --panel .9s ease, --composer-card .9s ease, --composer-foot .9s ease, --text .9s ease, --text-2 .9s ease, --text-3 .9s ease, --accent .9s ease, --accent-2 .9s ease, --bg-glow-1 .9s ease, --bg-glow-2 .9s ease, --hero-chip .9s ease, --hero-ink .9s ease, --hero-halo .9s ease; }
@media (prefers-reduced-motion: reduce) { :root { transition: none; } }

.theme-pop {
  position: fixed; z-index: 60; width: 296px; padding: 10px; border-radius: 14px;
  background: color-mix(in srgb, var(--panel-solid) 88%, transparent); border: 1px solid var(--border);
  -webkit-backdrop-filter: blur(24px) saturate(1.4); backdrop-filter: blur(24px) saturate(1.4);
  box-shadow: 0 24px 60px rgba(0,0,0,.35); opacity: 0; transform: translateY(-6px) scale(.98); transform-origin: top right;
  pointer-events: none; transition: opacity .18s ease, transform .22s cubic-bezier(.2,.8,.2,1);
}
.theme-pop.open { opacity: 1; transform: none; pointer-events: auto; }
.tp-head { font-size: 11.5px; color: var(--text-3); text-transform: uppercase; letter-spacing: .08em; padding: 2px 4px 8px; }
.tp-auto { width: 100%; display: flex; align-items: center; gap: 11px; padding: 10px; border-radius: 10px; text-align: left; border: 1px solid var(--border); background: var(--surface); transition: border-color .2s, background .2s; }
.tp-auto:hover { background: var(--surface-hover); }
.tp-auto.on { border-color: color-mix(in srgb, var(--accent) 60%, transparent); background: color-mix(in srgb, var(--accent) 9%, transparent); }
.tp-orb { width: 34px; height: 34px; border-radius: 50%; flex: none; background: conic-gradient(from 210deg, var(--a), var(--b), var(--c), var(--a)); box-shadow: inset 0 0 0 1px rgba(255,255,255,.15), 0 0 18px color-mix(in srgb, var(--a) 45%, transparent); }
.tp-txt { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tp-txt b { font-weight: 600; font-size: 13px; color: var(--text); }
.tp-txt small { font-size: 11.5px; color: var(--text-3); line-height: 1.35; }
.tp-check { width: 15px; height: 15px; margin-left: auto; color: var(--accent); opacity: 0; flex: none; }
.tp-auto.on .tp-check { opacity: 1; }
.tp-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 8px 0; }
.tp-sw { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 9px 4px 7px; border-radius: 10px; font-size: 11.5px; color: var(--text-2); border: 1px solid transparent; transition: background .2s, border-color .2s, color .2s; }
.tp-sw:hover { background: var(--surface-hover); color: var(--text); }
.tp-sw.on { border-color: color-mix(in srgb, var(--accent) 55%, transparent); color: var(--text); background: var(--surface); }
.tp-sw span { width: 26px; height: 26px; border-radius: 50%; background: linear-gradient(135deg, var(--a) 0 45%, var(--b) 45% 70%, var(--c) 70%); box-shadow: inset 0 0 0 1px rgba(255,255,255,.14); }
.tp-seg { display: flex; gap: 2px; padding: 3px; border-radius: 9px; background: var(--surface); }
.tp-label { font-size: 11.5px; color: var(--text-3); padding: 10px 4px 6px; }
.tp-seg button { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 6px; border-radius: 7px; font-size: 12.5px; color: var(--text-3); }
.tp-seg button svg { width: 14px; height: 14px; }
.tp-seg button.on { background: var(--surface-active); color: var(--text); }
.tp-seg.locked button { opacity: .7; }
.tp-seg.locked button.on { opacity: 1; }


/* ============================================================
   SESSION TABS — worktree on the left, its chats & tools as tabs
   ============================================================ */
.wt-ic { width: 15px; height: 15px; color: var(--accent); }
.wt-count { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; color: var(--text-3); margin-left: 2px; }
.wt-count svg { width: 11px; height: 11px; margin-left: 4px; }
.tabbar, .tabview { display: none; }
.main:not(.empty) .tabbar { display: flex; align-items: center; gap: 2px; padding: 8px 12px 6px; position: relative; z-index: 2; flex: none; overflow: hidden; border-bottom: 1px solid var(--border); }
.tabbar::-webkit-scrollbar { display: none; }
.tab { display: flex; align-items: center; gap: 7px; height: 30px; padding: 0 5px 0 10px; border-radius: 8px; font-size: 12.5px; color: var(--text-3); max-width: 210px; min-width: 44px; flex: 0 1 auto; cursor: pointer; position: relative; transition: background .15s, color .15s; user-select: none; }
.tab[data-id="chat"] { padding-right: 12px; }
.tab:hover { background: var(--surface-hover); color: var(--text-2); }
.tab.active { background: var(--surface-active); color: var(--text); }
.tab > svg { width: 14px; height: 14px; }
.tab .tt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tab .tx { width: 18px; height: 18px; border-radius: 5px; display: grid; place-items: center; color: var(--text-3); opacity: 0; transition: opacity .15s; }
.tab:hover .tx, .tab.active .tx { opacity: 1; }
.tab .tx:hover { background: var(--surface-active); color: var(--text); }
.tab .tx svg { width: 11px; height: 11px; }
.tab.live > svg.spark { animation: spin 2.4s linear infinite; }
.tab.enter { animation: tabIn .32s cubic-bezier(.2,.8,.2,1); }
@keyframes tabIn { from { opacity: 0; transform: translateY(4px) scale(.94); } }
.tab-add { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; color: var(--text-3); flex: none; margin-left: 2px; }
.tab-add:hover { background: var(--surface-hover); color: var(--text); }
.tab-hint { font-size: 11px; color: var(--text-3); opacity: .6; margin-left: 4px; flex: none; }
.main.on-tab .transcript, .main.on-tab .composer-wrap { display: none; }
.main.on-tab .tabview { display: flex; flex: 1; min-height: 0; position: relative; z-index: 1; }
.tabview > .tv { flex: 1; min-width: 0; min-height: 0; display: flex; background: var(--bg); animation: tvIn .25s ease; }
@keyframes tvIn { from { opacity: 0; } }
.chat-empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; padding: 18vh 0 0; color: var(--text-3); }
.chat-empty .spark { width: 22px; height: 22px; margin-bottom: 6px; }
.chat-empty b { color: var(--text); font-weight: 500; font-size: 15px; }
.ib { width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; color: var(--text-3); flex: none; }
.ib:hover { background: var(--surface-hover); color: var(--text); }
.bz-seg { display: flex; gap: 2px; padding: 2px; border-radius: 8px; background: var(--surface); }
.bz-seg button { padding: 4px 9px; border-radius: 6px; font-size: 12px; color: var(--text-3); display: flex; align-items: center; }
.bz-seg button svg { width: 13px; height: 13px; }
.bz-seg button.on { background: var(--surface-active); color: var(--text); }
.cbtn.primary { background: var(--accent); color: #fff; border-color: transparent; }
.hl-k { color: var(--accent); } .hl-s { color: #9fd49a; } .hl-c { color: var(--text-3); font-style: italic; } .hl-n { color: var(--yellow); } .hl-t { color: var(--blue); }
:root[data-theme="light"] .hl-s { color: #2f7a3a; } :root[data-theme="light"] .hl-n { color: #a8740a; }

/* New tab launcher — a quiet, keyboard-first list */
.tv-new { justify-content: center; align-items: flex-start; overflow-y: auto; }
.nt-list { width: min(420px, 90%); margin-top: 14vh; padding: 14px 10px; outline: 0; }
.nt-label { font-size: 12.5px; color: var(--text-3); padding: 0 12px 10px; }
.nt-row { display: flex; align-items: center; gap: 14px; width: 100%; height: 40px; padding: 0 8px 0 12px; border-radius: 9px; color: var(--text); font-size: 14px; text-align: left; transition: background .12s; animation: rise .45s calc(var(--i) * 22ms) cubic-bezier(.2,.8,.2,1) both; }
.nt-row svg { width: 18px; height: 18px; color: var(--text-2); stroke-width: 1.5; transition: color .12s; }
.nt-row span { flex: 1; }
.nt-row kbd { width: 22px; height: 22px; display: grid; place-items: center; border-radius: 5px; background: var(--surface-active); color: var(--text-3); font: 11.5px var(--font); }
.nt-row.sel { background: var(--surface-hover); }
.nt-row.sel svg { color: var(--accent); }
.nt-row.sel kbd { color: var(--text); background: color-mix(in srgb, var(--accent) 18%, var(--surface-active)); }

/* Browser */
.tv-browser { flex-direction: column; }
.bz-bar { display: flex; align-items: center; gap: 4px; padding: 7px 10px; border-bottom: 1px solid var(--border); }
.bz-url { flex: 1; display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 12px; margin: 0 6px; border-radius: 8px; background: var(--surface); color: var(--text-3); }
.bz-url svg { width: 13px; height: 13px; }
.bz-url input { flex: 1; background: none; border: 0; outline: 0; font-size: 13px; color: var(--text); }
.bz-url:focus-within { box-shadow: 0 0 0 1.5px color-mix(in srgb, var(--accent) 55%, transparent); }
.bz-load { height: 2px; background: var(--accent); transform-origin: left; transform: scaleX(0); opacity: 0; }
.bz-load.run { animation: load .7s cubic-bezier(.2,.8,.2,1); }
@keyframes load { 0% { transform: scaleX(0); opacity: 1; } 80% { transform: scaleX(1); opacity: 1; } 100% { transform: scaleX(1); opacity: 0; } }
.bz-stage { flex: 1; display: flex; justify-content: center; background: color-mix(in srgb, var(--text) 4%, var(--bg)); min-height: 0; }
.bz-stage iframe { width: 100%; height: 100%; border: 0; background: #fff; transition: width .35s cubic-bezier(.2,.8,.2,1); }

/* Editor */
.tv-editor { min-height: 0; }
.ed-tree { width: 220px; flex: none; border-right: 1px solid var(--border); padding: 8px 6px; overflow-y: auto; font-size: 12.5px; }
.ed-h { font: 11px var(--mono); color: var(--text-3); padding: 4px 8px 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ed-dir, .ed-file { display: flex; align-items: center; gap: 6px; width: 100%; padding: 4px 8px 4px calc(8px + var(--d) * 12px); border-radius: 6px; color: var(--text-2); text-align: left; white-space: nowrap; }
.ed-dir svg, .ed-file svg { width: 13px; height: 13px; color: var(--text-3); }
.ed-dir svg:first-child { width: 11px; }
.ed-file:hover { background: var(--surface-hover); }
.ed-file.on { background: var(--surface-active); color: var(--text); }
.ed-file.mod::after { content: "M"; margin-left: auto; font: 10px var(--mono); color: var(--yellow); }
.ed-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.ed-crumb { padding: 9px 16px; font-size: 12px; color: var(--text-3); border-bottom: 1px solid var(--border); }
.ed-crumb .sep { margin: 0 6px; opacity: .6; }
.ed-scroll { flex: 1; overflow: auto; display: flex; position: relative; font: 12.5px/1.7em var(--mono); }
.ed-gut { padding: 14px 10px 40px 16px; text-align: right; color: var(--text-3); user-select: none; opacity: .7; }
.ed-gut span { display: block; position: relative; }
.ed-gut span.mod::before { content: ""; position: absolute; left: -12px; top: 3px; bottom: 3px; width: 2px; border-radius: 2px; background: var(--accent); }
.ed-code { margin: 0; padding: 14px 24px 40px 8px; outline: 0; flex: 1; white-space: pre; tab-size: 2; caret-color: var(--accent); }
.ed-agent { position: absolute; left: 260px; font: 10px var(--font); padding: 1px 6px 1px 4px; border-radius: 4px; background: var(--accent-2); color: #fff; display: flex; align-items: center; gap: 4px; pointer-events: none; transform: translateY(-1.2em); transition: top .6s cubic-bezier(.2,.8,.2,1); }
.ed-agent i { position: absolute; left: 0; top: 100%; width: 2px; height: 1.7em; background: var(--accent-2); animation: blink 1.1s steps(1) infinite; }
.ed-status { display: flex; gap: 16px; padding: 5px 14px; border-top: 1px solid var(--border); font-size: 11.5px; color: var(--text-3); }
.ed-status .ag { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.ed-status .ag i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent-2); animation: pulse 1.6s ease-in-out infinite; }

/* Terminal */
.tv-term { background: color-mix(in srgb, #000 35%, var(--bg)) !important; }
:root[data-theme="light"] .tv-term { background: #1c1a1d !important; color: #e9e6e2; }
.term-body { flex: 1; overflow-y: auto; padding: 14px 18px; font: 12.5px/1.65 var(--mono); cursor: text; }
.term-body pre { margin: 0; font: inherit; white-space: pre-wrap; }
.term-out > div { white-space: pre-wrap; }
.term-line { display: flex; align-items: center; gap: 0; }
.term-line input { flex: 1; background: none; border: 0; outline: 0; font: inherit; color: inherit; margin-left: 8px; caret-color: var(--accent); }
.term-body .ps { color: var(--blue); } .term-body .br { color: var(--accent); } .term-body .pr { color: var(--green); }
.term-body .ok { color: var(--green); } .term-body .err { color: var(--red); } .term-body .y { color: var(--yellow); } .term-body .d { color: var(--blue); }
.term-body .dim { color: #8a847f; } .term-body b { color: inherit; font-weight: 600; }
.term-body .echo { margin-top: 6px; }

/* Changes */
.tv-diff { min-height: 0; }
.df-files { width: 260px; flex: none; border-right: 1px solid var(--border); padding: 10px 8px; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }
.df-sum { display: flex; gap: 8px; padding: 4px 8px 10px; font-size: 12.5px; }
.df-sum b { font-weight: 500; margin-right: auto; }
.tv-diff .a { color: var(--green); font: 11.5px var(--mono); } .tv-diff .d { color: var(--red); font: 11.5px var(--mono); }
.df-f { display: flex; align-items: center; gap: 6px; padding: 7px 8px; border-radius: 7px; text-align: left; font-size: 12.5px; }
.df-f:hover { background: var(--surface-hover); }
.df-f .nm { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.df-f .nm small { font-size: 11px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.df-f.viewed { opacity: .5; }
.df-acts { margin-top: auto; display: flex; gap: 6px; padding: 10px 4px 2px; }
.df-acts .cbtn { flex: 1; justify-content: center; }
.df-body { flex: 1; overflow-y: auto; padding: 14px 18px 40px; display: flex; flex-direction: column; gap: 14px; }
.df-card { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; flex: none; }
.df-head { display: flex; align-items: center; gap: 8px; padding: 8px 12px; font: 12px var(--mono); background: var(--surface); cursor: pointer; position: sticky; top: 0; }
.df-head svg { width: 12px; height: 12px; transition: transform .2s; }
.df-head label { display: flex; align-items: center; gap: 5px; font: 11.5px var(--font); color: var(--text-3); margin-left: 8px; cursor: pointer; }
.df-card.folded .df-hunks { display: none; }
.df-card.folded .df-head svg { transform: rotate(-90deg); }
.df-hh { padding: 4px 12px; font: 11.5px var(--mono); color: var(--text-3); background: color-mix(in srgb, var(--blue) 7%, transparent); }
.df-l { display: grid; grid-template-columns: 40px 40px 18px 1fr; font: 12px/1.75 var(--mono); }
.df-l .ln { text-align: right; padding-right: 8px; color: var(--text-3); opacity: .6; user-select: none; }
.df-l .sg { color: var(--text-3); user-select: none; }
.df-l code { white-space: pre; font: inherit; overflow: hidden; }
.df-l.add { background: color-mix(in srgb, var(--green) 11%, transparent); } .df-l.add .sg { color: var(--green); }
.df-l.del { background: color-mix(in srgb, var(--red) 11%, transparent); } .df-l.del .sg { color: var(--red); }

.df-head .pth { margin-right: auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.df-f .st { margin-right: 2px; }
.tv-diff.single .df-body { max-width: 1100px; width: 100%; margin: 0 auto; }
.df-card.single .df-head { cursor: default; }
.df-nav { display: flex; justify-content: space-between; gap: 8px; }
.df-nav .cbtn svg { width: 13px; height: 13px; }
/* Markdown */
.tv-md { flex-direction: column; }
.md-bar { display: flex; align-items: center; justify-content: space-between; padding: 8px 14px; border-bottom: 1px solid var(--border); font-size: 12.5px; color: var(--text-2); }
.md-bar > span { display: flex; align-items: center; gap: 7px; }
.md-body { flex: 1; display: flex; min-height: 0; }
.md-body textarea { flex: 1; resize: none; border: 0; outline: 0; background: none; padding: 26px 32px; font: 13px/1.7 var(--mono); color: var(--text-2); }
.md-body .md-out { flex: 1; overflow-y: auto; padding: 26px 40px 60px; max-width: 760px; margin: 0 auto; line-height: 1.65; }
.md-body[data-mode="preview"] textarea, .md-body[data-mode="source"] .md-out { display: none; }
.md-body[data-mode="split"] textarea { border-right: 1px solid var(--border); max-width: 50%; }
.md-out h1 { font-family: "Instrument Serif", Georgia, serif; font-weight: 400; font-size: 36px; margin: 0 0 10px; letter-spacing: -.01em; }
.md-out h2 { font-size: 15px; font-weight: 600; margin: 26px 0 8px; }
.md-out p, .md-out li { color: var(--text-2); }
.md-out code { font: 12.5px var(--mono); background: var(--surface-active); padding: 1px 5px; border-radius: 4px; }
.md-out pre { background: var(--surface); border: 1px solid var(--border); border-radius: 9px; padding: 12px 14px; font: 12.5px/1.6 var(--mono); overflow-x: auto; }
.md-out blockquote { margin: 12px 0; padding: 4px 14px; border-left: 2px solid var(--accent); color: var(--text-2); font-style: italic; }
.md-out ul.tasks { list-style: none; padding-left: 4px; }
.md-out ul.tasks input { accent-color: var(--accent); margin-right: 6px; }
.md-out a { color: var(--accent); }

/* Whiteboard */
.tv-wb { position: relative; overflow: hidden; background-color: var(--bg) !important; background-image: radial-gradient(color-mix(in srgb, var(--text) 13%, transparent) 1px, transparent 1.2px) !important; background-size: 22px 22px !important; }
.tv-wb canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: crosshair; touch-action: none; }
.wb-tools { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 3px; padding: 5px; border-radius: 12px; background: color-mix(in srgb, var(--panel-solid) 90%, transparent); border: 1px solid var(--border); backdrop-filter: blur(14px); box-shadow: 0 10px 30px rgba(0,0,0,.2); z-index: 2; }
.wb-tools button { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; color: var(--text-3); }
.wb-tools button:hover { color: var(--text); background: var(--surface-hover); }
.wb-tools button.on:not(.sw) { background: var(--surface-active); color: var(--text); }
.wb-tools .sw::before { content: ""; width: 14px; height: 14px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 1px var(--border); }
.wb-tools .sw.on::before { box-shadow: 0 0 0 2px var(--panel-solid), 0 0 0 3.5px var(--c); }
.wb-tools .sep { width: 1px; height: 18px; background: var(--border); margin: 0 4px; }
.wb-hint { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); font-size: 11.5px; color: var(--text-3); pointer-events: none; }
.wb-note { position: absolute; width: 170px; min-height: 90px; border-radius: 4px 4px 4px 14px; background: color-mix(in srgb, var(--n) 22%, var(--panel-solid)); border: 1px solid color-mix(in srgb, var(--n) 40%, transparent); box-shadow: 0 10px 24px rgba(0,0,0,.18); z-index: 1; animation: rise .4s cubic-bezier(.2,.8,.2,1) both; }
.wb-grip { height: 14px; cursor: grab; border-bottom: 1px dashed color-mix(in srgb, var(--n) 35%, transparent); }
.wb-text { padding: 8px 12px 12px; font-size: 13px; line-height: 1.45; outline: 0; }

/* Emulator */
.tv-emu { flex-direction: column; }
.emu-bar { display: flex; align-items: center; gap: 6px; padding: 7px 12px; border-bottom: 1px solid var(--border); }
.emu-st { margin-left: auto; display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--text-3); }
.emu-st i { width: 6px; height: 6px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); }
.emu-stage { flex: 1; display: grid; place-items: center; min-height: 0; overflow: auto; padding: 24px; background: radial-gradient(600px 400px at 50% 40%, color-mix(in srgb, var(--accent) 9%, transparent), transparent 70%); }
.emu-dev { padding: 10px; border-radius: 42px; background: linear-gradient(145deg, #3a3639, #121013); box-shadow: 0 0 0 1px rgba(255,255,255,.08), 0 30px 70px rgba(0,0,0,.45); transition: width .5s cubic-bezier(.2,.8,.2,1), height .5s cubic-bezier(.2,.8,.2,1), border-radius .5s; }
.emu-dev.phone { width: 270px; height: 560px; } .emu-dev.phone.land { width: 560px; height: 270px; }
.emu-dev.tablet { width: 470px; height: 620px; border-radius: 28px; } .emu-dev.tablet.land { width: 620px; height: 470px; }
.emu-screen { width: 100%; height: 100%; border-radius: 33px; overflow: hidden; background: #f7f5f2; color: #1d1b1a; display: flex; flex-direction: column; font-size: 12.5px; position: relative; }
.emu-dev.tablet .emu-screen { border-radius: 20px; }
.emu-dev.boot .emu-screen > * { animation: rise .6s cubic-bezier(.2,.8,.2,1) both; }
.app-status { display: flex; justify-content: space-between; align-items: center; padding: 12px 22px 4px; font-size: 11px; font-weight: 600; }
.app-status .cam { width: 9px; height: 9px; border-radius: 50%; background: #111; }
.app-h { display: flex; align-items: baseline; justify-content: space-between; padding: 14px 18px 10px; }
.app-h b { font-size: 22px; letter-spacing: -.02em; } .app-h span { color: #888; font-size: 11.5px; }
.app-card { margin: 0 12px 8px; padding: 12px 14px; border-radius: 14px; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.06); display: flex; flex-direction: column; gap: 9px; animation: rise .5s calc(var(--i) * 60ms + 100ms) cubic-bezier(.2,.8,.2,1) both; }
.app-card > div:first-child { display: flex; flex-direction: column; } .app-card small { color: #999; font-size: 11px; }
.app-bar { height: 4px; border-radius: 4px; background: #eee; overflow: hidden; }
.app-bar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; animation: appg 2.6s ease-in-out infinite alternate; }
@keyframes appg { from { width: 18%; } to { width: 88%; } }
.app-ok { color: #3a9a5a; font-weight: 600; }
.emu-dev.land .app-card { display: inline-flex; }
.app-tabbar { margin-top: auto; display: flex; justify-content: space-around; padding: 10px 0 16px; border-top: 1px solid #eee; color: #bbb; }
.app-tabbar .on { color: var(--accent); }


/* ============================================================
   USAGE — rings in the rail, details on hover
   ============================================================ */
.usage-btn svg.u-rings { width: 26px; height: 26px; transform: rotate(-90deg); overflow: visible; }
.u-rings circle { fill: none; stroke-width: 3; stroke-linecap: round; }
.u-rings .trk { stroke: var(--surface-active); }
.u-rings .c { stroke: var(--accent); transition: stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1); }
.u-rings .x { stroke: var(--blue); transition: stroke-dashoffset 1.2s .1s cubic-bezier(.2,.8,.2,1); }
.usage-btn { position: relative; }
.usage-btn.hot::after { content: ""; position: absolute; top: 5px; right: 5px; width: 6px; height: 6px; border-radius: 50%; background: var(--yellow); box-shadow: 0 0 0 2px var(--bg); }
.usage-pop {
  position: fixed; z-index: 60; width: 290px; padding: 14px 14px 10px; border-radius: 14px;
  background: color-mix(in srgb, var(--panel-solid) 92%, transparent); border: 1px solid var(--border);
  -webkit-backdrop-filter: blur(24px) saturate(1.4); backdrop-filter: blur(24px) saturate(1.4); box-shadow: 0 24px 60px rgba(0,0,0,.35);
  opacity: 0; transform: translateX(-6px) scale(.98); transform-origin: left bottom; pointer-events: none;
  transition: opacity .16s ease, transform .22s cubic-bezier(.2,.8,.2,1);
}
.usage-pop.open { opacity: 1; transform: none; pointer-events: auto; }
.up-head { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 600; padding: 0 2px 8px; }
.up-ref { display: flex; align-items: center; gap: 5px; color: var(--text-3); font-weight: 400; border-radius: 6px; padding: 2px 4px; }
.up-ref:hover { color: var(--text); } .up-ref svg { width: 12px; height: 12px; } .up-ref small { font-size: 11px; }
.up-ref.spin svg { animation: upSpin .7s linear infinite; } @keyframes upSpin { to { transform: rotate(360deg); } }
.usage-pop { width: 340px; max-height: calc(100vh - 16px); overflow-y: auto; scrollbar-width: none; }
.up-prov { padding: 10px 0 4px; border-top: 1px solid var(--border); }
.up-name { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 0 2px 6px; }
.up-name b { font-weight: 600; } .up-name small { color: var(--text-3); font-size: 11.5px; }
.up-name .mk { width: 20px; height: 20px; border-radius: 6px; display: grid; place-items: center; color: #fff; background: var(--m); }
.up-name .mk svg { width: 12px; height: 12px; stroke-width: 2.2; }
.up-add { margin-left: auto; width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; color: var(--text-3); }
.up-add:hover { background: var(--surface-hover); color: var(--text); } .up-add svg { width: 13px; height: 13px; }
.up-swap { margin: 0 2px 6px; font-size: 11.5px; color: var(--text-2); padding: 6px 8px; border-radius: 7px; background: color-mix(in srgb, var(--yellow) 12%, transparent); }
.ua { padding: 8px 8px 6px; margin: 0 -6px; border-radius: 9px; }
.ua + .ua { margin-top: 2px; }
.ua.on { background: color-mix(in srgb, var(--m) 8%, transparent); }
.ua-h { display: flex; align-items: center; gap: 9px; margin-bottom: 6px; }
.ua-pick { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--text-3); display: grid; place-items: center; flex: none; }
.ua-pick i { width: 6px; height: 6px; border-radius: 50%; }
.ua.on .ua-pick { border-color: var(--m); } .ua.on .ua-pick i { background: var(--m); }
.ua-t { display: flex; flex-direction: column; min-width: 0; } .ua-t b { font-size: 12.5px; font-weight: 600; } .ua-t small { font-size: 11px; color: var(--text-3); }
.ua-s { margin-left: auto; font-size: 11px; color: var(--text-3); white-space: nowrap; }
.ua.on .ua-s { color: var(--m); } .ua.full .ua-s { color: var(--yellow); }
.ua.mini { padding: 7px 8px; }
.ua.mini .ua-h { margin: 0; cursor: pointer; }
.ua-h[data-expand] { cursor: pointer; }
.ua.mini:hover { background: var(--surface-hover); }
.ua-mini { margin-left: auto; display: grid; grid-template-columns: 70px 34px; align-items: center; gap: 8px; }
.ua-mini b { font-size: 12px; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; } .ua-mini b.max { color: var(--yellow); }
.uw { display: grid; grid-template-columns: 104px 1fr 38px; align-items: center; gap: 10px; padding: 3px 0 3px 23px; }
.uw-l { display: flex; flex-direction: column; min-width: 0; } .uw-l span { font-size: 12px; color: var(--text-2); } .uw-l small { font-size: 10.5px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ua:not(.on) .uw-l span { color: var(--text-3); }
.ub { height: 5px; border-radius: 5px; background: var(--surface-active); overflow: hidden; }
.ub i { display: block; height: 100%; width: 0; border-radius: 5px; background: var(--m); transition: width .9s cubic-bezier(.2,.8,.2,1); }
.ua:not(.on) .ub i { background: color-mix(in srgb, var(--m) 55%, var(--text-3)); }
.ub i.max { background: var(--yellow) !important; }
.uw b { font-size: 12px; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; } .uw b.max { color: var(--yellow); }
.ua-note { display: flex; align-items: center; gap: 6px; margin: 4px 0 0 23px; font-size: 11px; color: var(--text-2); }
.ua-note svg { width: 11px; height: 11px; color: var(--m); flex: none; }
.up-new { display: flex; gap: 6px; padding: 6px 2px 4px; } .up-new[hidden] { display: none; }
.up-new input { flex: 1; min-width: 0; height: 28px; padding: 0 9px; border-radius: 7px; border: 1px solid var(--border); background: var(--surface); font-size: 12px; color: var(--text); }
.up-new select { height: 28px; border-radius: 7px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 12px; padding: 0 4px; }
.up-new button { height: 28px; padding: 0 10px; border-radius: 7px; background: var(--m); color: #fff; font-size: 12px; font-weight: 600; }
.up-foot { border-top: 1px solid var(--border); padding: 10px 2px 2px; font-size: 12px; }
.up-auto { display: flex; align-items: center; justify-content: space-between; gap: 10px; color: var(--text-2); cursor: pointer; }
.up-auto .tgl { transform: scale(.85); transform-origin: right center; }


/* Right panel: view switcher + Files + Actions */
.right-inner { display: flex; flex-direction: column; }
.right-inner > .rp { flex: 1; min-height: 0; height: auto; }
.rp-bar { display: flex; align-items: flex-end; gap: 4px; height: 46px; padding: 0 12px; border-bottom: 1px solid var(--border); flex: none; }
.rp-bar button { position: relative; width: 38px; height: 38px; display: grid; place-items: center; color: var(--text-3); border-radius: 8px 8px 0 0; transition: color .15s; }
.rp-bar button:hover { color: var(--text); }
.rp-bar button svg { width: 18px; height: 18px; }
.rp-bar button.on { color: var(--text); }
.rp-bar button.on::after { content: ""; position: absolute; left: 9px; right: 9px; bottom: -1px; height: 2px; border-radius: 2px; background: var(--text); }
.rp-bar b { position: absolute; top: 6px; left: 22px; min-width: 14px; height: 14px; padding: 0 3.5px; border-radius: 7px; font: 600 9px/14px var(--font); text-align: center; color: #fff; background: var(--accent); box-shadow: 0 0 0 2px var(--bg); }
.rp-vh { display: flex; align-items: center; gap: 8px; padding: 12px 10px 8px 16px; font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-2); flex: none; }
.rp-vh code { font: 11.5px var(--mono); letter-spacing: 0; text-transform: none; color: var(--text-3); font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rp-vh .hint { font-weight: 400; letter-spacing: 0; text-transform: none; color: var(--text-3); font-size: 12px; }
.rp-vh .ib { width: 24px; height: 24px; } .rp-vh .ib svg { width: 14px; height: 14px; }
.ft { flex: 1; overflow-y: auto; padding: 2px 0 16px; }
.ft-row { display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px 0 calc(12px + var(--d) * 14px); font-size: 13px; color: var(--text); cursor: pointer; white-space: nowrap; user-select: none; }
.ft-row:hover { background: var(--surface-hover); }
.ft-row.on { background: var(--surface-active); }
.ft-row .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.ft-row .chev { width: 12px; height: 12px; color: var(--text-3); transform: rotate(-90deg); transition: transform .12s; flex: none; }
.ft-row.open .chev { transform: none; }
.ft-row .fo { width: 15px; height: 15px; color: var(--text-3); flex: none; }
.ft-row.file { padding-left: calc(30px + var(--d) * 14px); }
.ft-row .fi { width: 15px; height: 15px; color: var(--text-3); flex: none; }
.ft-row.chg-M .nm { color: var(--yellow); } .ft-row.chg-A .nm { color: var(--green); } .ft-row.chg-D .nm { color: var(--red); text-decoration: line-through; }
.ft-row .st { background: none !important; width: auto; font: 600 11px var(--mono); }
.ft-row .dirty { width: 6px; height: 6px; border-radius: 50%; background: var(--yellow); opacity: .8; }
.act-list { display: flex; flex-direction: column; padding: 2px 8px; }
.act { display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 6px; border-radius: 8px; }
.act:hover { background: var(--surface-hover); }
.act .ib { width: 28px; height: 28px; border-radius: 7px; border: 1px solid var(--border); color: var(--text-2); flex: none; }
.act .ib svg { width: 12px; height: 12px; }
.act .ib:hover { color: var(--text); border-color: color-mix(in srgb, var(--text) 18%, transparent); }
.act.live .ib, .act.run .ib { color: var(--red); }
.act .ai { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.act .an { font-size: 13px; color: var(--text); }
.act code { font: 11.5px var(--mono); color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.as { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-3); white-space: nowrap; flex: none; }
.as.live { color: var(--text-2); cursor: pointer; } .as.live:hover { color: var(--text); text-decoration: underline; text-underline-offset: 3px; }
.as.live i { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); }
.as.ok { color: var(--green); } .as.fail { color: var(--red); }
.as .spinner { width: 11px; height: 11px; }
.act-add { display: flex; align-items: center; gap: 8px; margin: 6px 16px; padding: 6px 4px; font-size: 12.5px; color: var(--text-3); }
.act-add:hover { color: var(--text); }
.act-add svg { width: 14px; height: 14px; }


/* ============================================================
   FLAT STYLE — solid surfaces, hairline borders, no blur or glow.
   Toggle in the theme picker; works with every palette + light/dark.
   ============================================================ */
:root[data-style="flat"] { --radius: 8px; --radius-lg: 12px; }
:root[data-style="flat"] * { -webkit-backdrop-filter: none !important; backdrop-filter: none !important; text-shadow: none !important; }
:root[data-style="flat"] body { background: var(--bg); }
/* chrome & panels */
:root[data-style="flat"] .avatar { background: var(--accent); }
:root[data-style="flat"] .agent-ring { box-shadow: none; border-width: 1.5px; }
/* composer: a solid card with a hairline, no halo */
:root[data-style="flat"] .composer, :root[data-style="flat"] .main.empty .composer { background: var(--composer-foot); border: 0; box-shadow: none; border-radius: 14px; }
:root[data-style="flat"] .composer-card, :root[data-style="flat"] .main.empty .composer-card { background: var(--composer-card); border-radius: 14px; box-shadow: none; }
:root[data-style="flat"] .main.empty .composer::after { display: none; }
:root[data-style="flat"] .hero-chips button, :root[data-style="flat"] .hero-switch, :root[data-style="flat"] .scene-switch .pills, :root[data-style="flat"] .scene-switch .cap { background: var(--panel-solid); }
/* headlines: clean sans instead of serif / gradient text */
:root[data-style="flat"] #main:not([data-hero="ascii"]) .hero-head h1 { font-family: var(--font); font-weight: 600; letter-spacing: -0.035em; font-size: clamp(30px, 3.4vw, 44px); line-height: 1.1;
  background: none; -webkit-background-clip: border-box; background-clip: border-box; color: var(--hero-ink); filter: none; }
:root[data-style="flat"] .hero-head h1 em, :root[data-style="flat"] #main[data-hero="molten"] .hero-head h1 em { font-style: normal; background: none; -webkit-background-clip: border-box; background-clip: border-box; color: var(--accent); animation: none; }
:root[data-style="flat"] .md-out h1 { font-family: var(--font); font-weight: 600; font-size: 28px; letter-spacing: -0.03em; }
/* dashboard */
:root[data-style="flat"] .card { background: var(--panel-solid); border-radius: 12px; }
:root[data-style="flat"] .meter i, :root[data-style="flat"] .prog i, :root[data-style="flat"] .bar-c i { background: var(--accent); }
:root[data-style="flat"] .bar-c:last-child i, :root[data-style="flat"] .l4 { box-shadow: none; }
:root[data-style="flat"] .l4 { background: var(--accent) !important; }
:root[data-style="flat"] .tag.quick { background: color-mix(in srgb, var(--accent) 14%, transparent); border-color: color-mix(in srgb, var(--accent) 30%, transparent); }
:root[data-style="flat"] .live i, :root[data-style="flat"] .pulse, :root[data-style="flat"] .emu-st i, :root[data-style="flat"] .as.live i { box-shadow: none; }
:root[data-style="flat"] .toast { box-shadow: 0 8px 24px rgba(0,0,0,.2); }
/* popovers & menus: solid with a small, tight shadow */
:root[data-style="flat"] .theme-pop, :root[data-style="flat"] .usage-pop, :root[data-style="flat"] .rp-menu, :root[data-style="flat"] .wb-tools, :root[data-style="flat"] .dash-tip { background: var(--panel-solid); box-shadow: 0 8px 24px rgba(0,0,0,.18); }
/* tools */
:root[data-style="flat"] .emu-stage { background: var(--bg); }
:root[data-style="flat"] .emu-dev { background: #1c1a1d; box-shadow: 0 0 0 1px var(--border), 0 12px 30px rgba(0,0,0,.25); }
:root[data-style="flat"] .nt-row, :root[data-style="flat"] .rp-split, :root[data-style="flat"] .rp-btn, :root[data-style="flat"] .rp-msg textarea { box-shadow: none; }
:root[data-style="flat"] .rp-split.primary { background: var(--accent); }


/* ============================================================
   PAGES — Automations + Plugins (full width, flat)
   ============================================================ */
.main, .page { grid-column: 3; grid-row: 1; }
.rail { grid-column: 1; grid-row: 1; } .sidebar { grid-column: 2; grid-row: 1; } .right { grid-column: 4; grid-row: 1; }
.page { display: none; min-width: 0; min-height: 0; margin-top: 44px; border-top: 1px solid var(--border); border-left: 1px solid var(--border); border-top-left-radius: 12px; background: var(--bg); overflow: hidden; position: relative; }
.app[data-view="automations"] #pageAuto, .app[data-view="plugins"] #pagePlugins, .app[data-view="settings"] #pageSettings { display: flex; }
.app[data-view="automations"] .main, .app[data-view="plugins"] .main, .app[data-view="settings"] .main { display: none; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 32px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 13px; font-weight: 500; white-space: nowrap; transition: background .15s, border-color .15s, color .15s; }
.btn:hover { background: var(--surface-hover); }
.btn svg { width: 14px; height: 14px; }
.btn.primary { background: var(--accent); border-color: transparent; color: #fff; }
.btn.primary:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .45; cursor: default; filter: none; }
.btn.ghost { padding: 0 9px; color: var(--text-3); }
.btn.danger { color: var(--red); border-color: color-mix(in srgb, var(--red) 40%, transparent); }
.btn.sm { height: 28px; padding: 0 11px; font-size: 12.5px; }
.btn.on { color: var(--green); border-color: color-mix(in srgb, var(--green) 35%, transparent); background: color-mix(in srgb, var(--green) 8%, transparent); }
.btn.wide { width: 100%; height: 36px; }
.btn .spinner { width: 12px; height: 12px; }
.avatar.sm { width: 20px; height: 20px; font-size: 10px; }
/* Automations */
.au-list { width: 300px; flex: none; border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
.au-search { display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 10px 0 16px; border-bottom: 1px solid var(--border); color: var(--text-3); flex: none; }
.au-search svg { width: 15px; height: 15px; }
.au-search input { flex: 1; background: none; border: 0; outline: 0; font-size: 13.5px; color: var(--text); min-width: 0; }
.au-search .ib { width: 28px; height: 28px; }
.au-items { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 2px; }
.au-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 10px; border-radius: 8px; text-align: left; }
.au-item:hover { background: var(--surface-hover); } .au-item.on { background: var(--surface-active); }
.au-item.draft b { color: var(--text-2); font-style: italic; }
.au-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-3); opacity: .5; flex: none; }
.au-dot.on { background: var(--green); opacity: 1; }
.au-it { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.au-it b { font-weight: 500; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.au-it small { font-size: 12px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.au-last { font: 600 11.5px var(--mono); flex: none; } .au-last.ok { color: var(--green); } .au-last.bad { color: var(--red); }
.au-empty { padding: 24px 14px; color: var(--text-3); font-size: 13px; }
.au-main { flex: 1; min-width: 0; overflow-y: auto; }
.au-head { padding: 26px 40px 22px; border-bottom: 1px solid var(--border); }
.au-title-row { display: flex; align-items: center; gap: 16px; }
.au-title { flex: 1; min-width: 0; background: none; border: 0; outline: 0; font: 600 26px/1.2 var(--font); letter-spacing: -0.025em; color: var(--text); padding: 2px 0; border-bottom: 1px solid transparent; }
.au-title:focus { border-bottom-color: var(--border); }
.au-actions { display: flex; gap: 8px; flex: none; }
.au-meta { display: flex; align-items: center; gap: 10px; margin-top: 14px; font-size: 13px; color: var(--text-2); flex-wrap: wrap; }
.au-meta .sep { width: 1px; height: 14px; background: var(--border); }
.au-owner { display: inline-flex; align-items: center; gap: 7px; color: var(--text); font-weight: 500; }
.au-owner svg { width: 12px; height: 12px; color: var(--text-3); }

.ss-hm i.l2 { background: color-mix(in srgb, var(--accent) 50%, transparent) !important; }
.ss-hm i.l3 { background: color-mix(in srgb, var(--accent) 76%, transparent) !important; }
.ss-hm i.l4 { background: var(--accent) !important; box-shadow: 0 0 8px color-mix(in srgb, var(--accent) 55%, transparent); }
.ss-hm i.fut { background: transparent; outline: 1px dashed color-mix(in srgb, var(--text) 8%, transparent); }
.ss-hm i.best::after { content: ""; position: absolute; inset: -3px; border-radius: 5px; border: 1.5px solid var(--text); opacity: .7; }
.ss-hmf { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; font-size: 11.5px; color: var(--text-3); }
.ss-leg { display: flex; align-items: center; gap: 3px; }
.ss-leg i { width: 9px; height: 9px; border-radius: 2px; }
.ss-tip { position: fixed; z-index: 70; pointer-events: none; padding: 6px 9px; border-radius: 8px; background: var(--panel-solid); border: 1px solid var(--border); font-size: 12px; box-shadow: 0 10px 24px rgba(0,0,0,.3); opacity: 0; transition: opacity .1s; white-space: nowrap; }
.ss-tip.on { opacity: 1; }
.ss-tip small { color: var(--text-3); margin-left: 6px; }
.ss-mix { display: flex; height: 12px; border-radius: 999px; overflow: hidden; gap: 2px; background: color-mix(in srgb, var(--text) 6%, transparent); margin: 6px 0 14px; }
.ss-mix i { height: 100%; min-width: 3px; transition: flex-basis .5s cubic-bezier(.2,.8,.2,1); }
.ss-mixl { display: grid; gap: 8px; }
.ss-mixl div { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text-2); }
.ss-mixl div i { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.ss-mixl div b { margin-left: auto; font-weight: 500; color: var(--text); font-variant-numeric: tabular-nums; }
.ss-mixl div small { width: 38px; text-align: right; color: var(--text-3); font-variant-numeric: tabular-nums; }
.ss-row2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; margin-top: 12px; }
.ss-bars { display: grid; gap: 10px; margin-top: 12px; }
.ss-bar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; font-size: 12.5px; }
.ss-bar span { display: flex; align-items: center; gap: 7px; min-width: 0; color: var(--text-2); }
.ss-bar span .pi { width: 16px; height: 16px; flex: none; image-rendering: pixelated; }
.ss-bar em { font-style: normal; color: var(--text); font-variant-numeric: tabular-nums; }
.ss-bar .tr { grid-column: 1 / -1; height: 6px; border-radius: 99px; background: color-mix(in srgb, var(--text) 6%, transparent); overflow: hidden; }
.ss-bar .tr i { display: block; height: 100%; border-radius: 99px; background: var(--accent); }
.ss-fun { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-top: 12px; }
.ss-fun .ss-box { display: flex; gap: 12px; align-items: center; }
.ss-fun .em { font-size: 22px; width: 36px; text-align: center; flex: none; }
.ss-fun b { display: block; font-size: 14px; }
.ss-fun small { display: block; color: var(--text-3); font-size: 12px; margin-top: 1px; }
.ss-note { margin-top: 14px; font-size: 12px; color: var(--text-3); display: flex; align-items: center; gap: 6px; }
.ss-note svg { width: 13px; height: 13px; }
@media (max-width: 900px) { .ss-wrap { padding: 24px 20px 56px; } }
.ss-kpi > div, .ss-tile > div { min-width: 0; } .ss-kpi small, .ss-tile small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ss-sec { flex-wrap: wrap; }

/* Signed out */
.so { position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; background: #040c26; color: #e6efff; opacity: 0; pointer-events: none; transition: opacity .5s ease; }
.so.on { opacity: 1; pointer-events: auto; }
.so canvas { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
.so-card { position: relative; z-index: 2; text-align: center; margin-top: 150px; }
.so-card h1 { margin: 0; font-size: 30px; font-weight: 600; letter-spacing: -.03em; }
.so-card p { margin: 8px 0 22px; color: #9db3e0; }
.so-card .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.so-card button { height: 40px; padding: 0 18px; border-radius: 10px; font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 9px; }
.so-card .p { background: #9cc8ff; color: #06163a; }
.so-card .p:hover { filter: brightness(1.08); }
.so-card .s { border: 1px solid rgba(156, 200, 255, .3); color: #cfe0ff; }
.so-card .s:hover { background: rgba(156, 200, 255, .08); }
.so-card svg { width: 16px; height: 16px; }
.so-card small { display: block; margin-top: 18px; font-size: 12px; color: #6f86b8; }
</style>
</head>

<script>
/* ============================================================
   MOCK DATA — edit freely to iterate on content
   ============================================================ */
const threads = [
  { id: 1, group: "Priority", title: "Background agents panel", repo: "tako", pr: 2150, prState: "open", branch: "tako/background-agent-panel", running: true },
  { id: 2, group: "Today", title: "Duplicate message on resume", repo: "tako", pr: 2149, prState: "open", branch: "tako/fix-duplicate-msg", unread: true },
  { id: 3, group: "Yesterday", title: "Multi-project worktree label", repo: "tako", pr: 2131, prState: "merged", branch: "tako/fix-multi-proj" },
  { id: 4, group: "Yesterday", title: "Skill recognition failure", repo: "tako", pr: 2142, prState: "open", branch: "tako/debug-skill-recog" },
  { id: 5, group: "Yesterday", title: "Breadcrumb header w/o tabs", repo: "tako", pr: 2141, prState: "draft", branch: "tako/breadcrumb-header" },
  { id: 6, group: "Yesterday", title: "Retry on transient 403", repo: "api", pr: 2138, prState: "merged", branch: "api/retry-transient" },
  { id: 7, group: "Yesterday", title: "Inline images in messages", repo: "tako", pr: 2139, prState: "open", branch: "tako/inline-images" },
  { id: 8, group: "Last week", title: "Auto-reconnect remote host", repo: "tako", pr: 2133, prState: "merged", branch: "tako/auto-reconnect" },
  { id: 9, group: "Last week", title: "PR attachment logic", repo: "tako", pr: 2132, prState: "open", branch: "tako/pr-attachments" },
];

// Transcript blocks: user | text | tool | thinking
const transcripts = {
  1: [
    { type: "user", steer: true, text: "One more thing — the divider under the resumed header shouldn't render. Dividers are only for “worked for” summaries." },
    { type: "text", text: "<code>fmt:check</code> broke after the rebase. Fixing that along with removing the divider under the “Resumed” headers. Checking formatting first." },
    { type: "tool", label: "Ran 6 commands", body: '<span class="cmd">$ bun run fmt:check</span>\n<span class="err">✗ src/components/chat/Timeline.tsx</span>\n<span class="cmd">$ bunx fmt --write src/components/chat/Timeline.tsx</span>\n<span class="ok">✓ formatted 1 file</span>' },
    { type: "text", text: "Adding a check that resumed headers have no divider, reusing the existing collapse test:" },
    { type: "tool", label: "Ran 3 commands", body: '<span class="cmd">$ bun test timeline.collapse</span>\n<span class="ok">✓ 14 passed</span> (212ms)' },
    { type: "text", text: "Passes. Confirming the new assertion fails without the fix:" },
    { type: "tool", label: "Ran cp src/components/chat/Timeline.tsx /tmp/backup.tsx && git stash …", body: '<span class="err">✗ resumed header renders divider\n  expected 0, received 1</span>\n<span class="cmd">$ git stash pop</span>' },
    { type: "text", text: "Fails without the fix, passes with it. Running full checks, then splitting commits: rebase formatting into the main commit, divider fix into its own." },
    { type: "tool", icon: "i-term", label: "Bash", body: '<span class="cmd">$ bun run check</span>\n<span class="ok">✓ unit 6153 passed\n✓ typecheck\n✓ lint</span>' },
    { type: "text", text: "Unit tests (6153), typecheck, and lint pass. Force-pushing the rebased branch with <code>--force-with-lease</code> and updating the PR description:" },
    { type: "tool", running: true, label: "Running git push -q --force-with-lease origin HEAD", body: '<span class="cmd">$ git push -q --force-with-lease origin HEAD</span>\n…' },
    { type: "thinking" },
  ],
};
const defaultTranscript = (t) => [
  { type: "user", text: `Can you take a look at “${t.title}”?` },
  { type: "text", text: "Sure — exploring the relevant code first." },
  { type: "tool", label: "Read 4 files", body: "src/app.tsx\nsrc/lib/session.ts\nsrc/components/Sidebar.tsx\nsrc/hooks/useThread.ts" },
  { type: "text", text: `Found the cause. Opened <code>#${t.pr}</code> on <code>${t.branch}</code> with the fix and a regression test.` },
];

const panel = (t) => [
  { title: "Environment", gear: true, items: [
    { icon: "i-diff", text: "Changes", end: '<span class="diffstat"><span class="a">+142</span> <span class="d">−37</span></span>' },
    { icon: "i-worktree", text: "Worktree" },
    { icon: "i-branch", text: t.branch, chev: true },
    { icon: "i-cloud", text: "Commit and Push", chev: true },
  ]},
  { title: "Actions", arrow: true, items: [
    { icon: "i-globe", text: "Local servers", end: "0", chev: true },
  ]},
  { title: "Repository", items: [
    { icon: "i-github", text: `acme/${t.repo}`, end: '<svg><use href="#i-ext"/></svg>' },
  ]},
  { title: "Pull request", items: [
    { icon: "i-pr", text: `#${t.pr} ${t.title}`, end: t.prState === "open" ? '<svg class="badge-err"><use href="#i-shield"/></svg>' : `<span>${t.prState}</span>`, chev: true },
  ]},
  { title: "Editor", items: [
    { icon: "i-code", text: "Editor view" },
    { icon: "i-ext", text: "Open in VS Code", chev: true },
  ]},
];

/* ============================================================
   RENDERING
   ============================================================ */
let activeId = 1;
let chatKey = null;                       // which chat session (tab) in the worktree is showing; null = the worktree's main chat
const ckey = () => chatKey ?? activeId;
let view = "home";   // "home" (welcome + dashboard) | "chats" (threads + conversation)
const $ = (s) => document.querySelector(s);
const icon = (id, cls = "") => `<svg class="${cls}"><use href="#${id}"/></svg>`;

function renderThreads(filter = "") {
  const groups = {};
  threads.filter(t => t.title.toLowerCase().includes(filter.toLowerCase()))
    .forEach(t => (groups[t.group] ??= []).push(t));
  $("#threads").innerHTML = Object.entries(groups).map(([g, list]) => `
    <div class="group-label">${g}</div>
    ${list.map(t => `
      <div class="thread ${t.id === activeId ? "active" : ""}" data-id="${t.id}">
        <div class="thread-title">${icon("i-worktree", "wt-ic")}<span class="t">${t.title}</span>
          ${window.forgeTabCount ? forgeTabCount(t.id) : ""}${t.running ? '<span class="spinner"></span>' : t.unread ? '<span class="dot"></span>' : ""}</div>
        <div class="thread-meta">
          <span class="repo-badge">${t.repo[0].toUpperCase()}</span>${t.repo}
          ${icon("i-pr")}<span class="pr ${t.prState}">#${t.pr}</span>
          ${icon("i-branch")}<span class="branch">${t.branch}</span>
        </div>
      </div>`).join("")}
  `).join("");
}

function blockHTML(b) {
  if (b.type === "user") return `<div class="msg-user">${b.steer ? `<div class="steer">${icon("i-steer")} Steering conversation</div>` : ""}<div class="bubble">${b.text}</div></div>`;
  if (b.type === "text") return `<p class="prose">${b.text}</p>`;
  if (b.type === "thinking") return `<div class="thinking">${icon("i-clock")}<span class="shimmer">Thinking</span></div>`;
  if (b.type === "tool") return `
    <div class="tool">${b.running ? '<span class="spinner"></span>' : icon(b.icon || "i-term")}<span class="label">${b.label}</span>${icon("i-chev-r", "chev")}</div>
    <div class="tool-body">${b.body || ""}</div>`;
  return "";
}

function renderFeed() {
  const t = threads.find(t => t.id === activeId);
  const blocks = transcripts[ckey()] ??= defaultTranscript(t);
  const home = view === "home";
  const fresh = paintFeed(home ? null : ckey(), home ? [] : blocks.map(blockHTML),
    home ? "" : `<div class="chat-empty">${icon("i-spark", "spark")}<b>New session in ${t.branch}</b><span>Same worktree, same files — a fresh agent with its own context.</span></div>`);
  $("#tbTitle").textContent = home ? "Home" : t.title;
  const running = !home && blocks.at(-1)?.type === "thinking";
  $("#sendBtn").innerHTML = running ? '<span class="stop"></span>' : icon("i-up");
  $("#sendBtn").classList.toggle("stopping", running);
  $("#main").classList.toggle("empty", home);
  const page = view === "automations" || view === "plugins" || view === "settings" || view === "stats";
  $("#app").classList.toggle("is-empty", home || page);
  $("#app").dataset.view = view;
  $("#autoBtn").classList.toggle("active", view === "automations");
  $("#pluginsBtn").classList.toggle("active", view === "plugins");
  $("#settingsBtn").classList.toggle("active", view === "settings");
  $("#input").placeholder = home ? "Ask anything, @ to mention…" : "Ask for follow-up changes";
  $("#homeBtn").classList.toggle("active", home);
  $("#chatsBtn").classList.toggle("active", view === "chats");
  $("#ctxRepo").textContent = t.repo;
  $("#ctxBranch").textContent = home ? "main" : t.branch;
  $("#ctxRing").style.setProperty("--ctx", Math.min(90, 8 + blocks.length * 6) + "%");
  if (fresh) feedScroll(true);
}

/* Feed painting without the jump: when the same chat grows, keep the blocks already on screen,
   add only the new ones (invisible), glide the pane up to make room, then fade them into place. */
let feedKey, feedHTML = [], feedAnim = 0;
const feedReduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
function paintFeed(key, htmls, emptyHTML) {
  const feed = $("#feed");
  const same = key !== null && key === feedKey && htmls.length > 0;
  if (same && !feedHTML.length) feed.innerHTML = "";        // first message replaces the empty-chat placeholder
  if (!same) {
    feed.innerHTML = htmls.length ? htmls.map((h, i) => tagBlock(h, i)).join("") : emptyHTML;
    feedKey = key; feedHTML = htmls; return true;
  }
  let k = 0; while (k < htmls.length && k < feedHTML.length && htmls[k] === feedHTML[k]) k++;
  if (k === htmls.length && k === feedHTML.length) return false;
  // Pull the changed tail off; reuse any node whose markup is unchanged (e.g. the "Thinking" row moving down)
  const spare = new Map();
  for (let i = k; i < feedHTML.length; i++) {
    const nodes = [...feed.querySelectorAll(`:scope > [data-b="${i}"]`)];
    nodes.forEach(n => n.remove());
    if (!spare.has(feedHTML[i])) spare.set(feedHTML[i], nodes);
  }
  const entering = [];
  for (let i = k; i < htmls.length; i++) {
    let nodes = spare.get(htmls[i]);
    if (nodes) spare.delete(htmls[i]);
    else {
      const tpl = document.createElement("template"); tpl.innerHTML = tagBlock(htmls[i], i);
      nodes = [...tpl.content.children]; entering.push(...nodes);
    }
    nodes.forEach(n => { n.dataset.b = i; feed.appendChild(n); });
  }
  feedHTML = htmls;
  const EZ = "cubic-bezier(.2,.8,.2,1)";
  // Blocks that are gone (e.g. "Thinking" when the reply finishes) fold away instead of vanishing
  const leaving = feedReduce ? [] : [...spare.values()].flat();
  leaving.forEach(n => { n.dataset.b = "x"; feed.appendChild(n); });
  if (!feedReduce) {
    // New blocks open their own space smoothly (everything below slides down), then the content fades in
    const grow = n => {
      const cs = getComputedStyle(n), h = n.offsetHeight;
      return { n, h, mt: cs.marginTop, mb: cs.marginBottom, pt: cs.paddingTop, pb: cs.paddingBottom };
    };
    const g = entering.filter(n => getComputedStyle(n).display !== "none").map(grow), l = leaving.map(grow);
    g.forEach(({ n, h, mt, mb, pt, pb }, j) => {
      n.style.overflow = "hidden";
      n.animate([{ height: "0px", marginTop: "0px", marginBottom: "0px", paddingTop: "0px", paddingBottom: "0px" }, { height: h + "px", marginTop: mt, marginBottom: mb, paddingTop: pt, paddingBottom: pb }],
        { duration: 300, delay: j * 40, easing: EZ, fill: "backwards" }).onfinish = () => { n.style.overflow = ""; };
      n.animate([{ opacity: 0, transform: "translateY(6px)" }, { opacity: 1, transform: "none" }], { duration: 320, delay: 120 + j * 60, easing: EZ, fill: "backwards" });
    });
    l.forEach(({ n, h, mt, mb, pt, pb }) => {
      n.style.overflow = "hidden";
      const an = n.animate([{ height: h + "px", marginTop: mt, marginBottom: mb, paddingTop: pt, paddingBottom: pb, opacity: 1 }, { height: "0px", marginTop: "0px", marginBottom: "0px", paddingTop: "0px", paddingBottom: "0px", opacity: 0 }],
        { duration: 260, easing: EZ, fill: "forwards" });
      an.onfinish = an.oncancel = () => n.remove();
    });
  }
  feedScroll(false, 520);
  return false;
}
function tagBlock(h, i) { return h.replace(/^\s*<(\w+)/, `<$1 data-b="${i}"`).replace(/(<\/div>\s*)<div class="tool-body"/, `$1<div data-b="${i}" class="tool-body"`); }
// Scroll to the newest message. Instant on a fresh paint; otherwise eased, and only if the reader was already near the bottom.
let feedWasNear = true;
$("#transcript").addEventListener("scroll", e => { if (!feedAnim) { const tr = e.currentTarget; feedWasNear = tr.scrollHeight - tr.clientHeight - tr.scrollTop < 120; } }, { passive: true });
function feedScroll(instant, D = 420) {
  const tr = $("#transcript");
  if (instant || feedReduce) { cancelAnimationFrame(feedAnim); feedAnim = 0; tr.style.scrollBehavior = "auto"; tr.scrollTop = tr.scrollHeight; tr.style.scrollBehavior = ""; feedWasNear = true; return true; }
  if (!feedWasNear) return false;
  cancelAnimationFrame(feedAnim);
  const from = tr.scrollTop, t0 = performance.now();
  tr.style.scrollBehavior = "auto";
  const step = now => {
    const p = Math.min(1, (now - t0) / D), e = 1 - Math.pow(1 - p, 3), to = tr.scrollHeight - tr.clientHeight;
    tr.scrollTop = from + (to - from) * e;
    if (p < 1) feedAnim = requestAnimationFrame(step); else { feedAnim = 0; tr.style.scrollBehavior = ""; feedWasNear = true; }
  };
  feedAnim = requestAnimationFrame(step);
  return true;
}

function renderPanel() {
  const t = threads.find(t => t.id === activeId);
  $("#rightPanel").innerHTML = panel(t).map(s => `
    <div class="section">
      <div class="sec-head"><span>${s.title}</span>
        ${s.gear ? icon("i-gear") : s.arrow ? icon("i-chev-r") : s.collapsible ? icon("i-chev-d", "chev") : ""}</div>
      <div class="sec-body">
        ${(s.items || []).map(i => `
          <div class="item">${icon(i.icon, i.spark ? "spark" : "")}<span class="t">${i.text}</span>
            <span class="end">${i.usage ? `<span class="usage-nums">${i.usage.map(([k, v]) => `<span>${k}</span><b>${v}</b>`).join("")}</span>` : (i.end || "")}${i.chev ? icon("i-chev-d") : ""}</span>
          </div>${i.bar ? `<div class="bar"><i style="width:${i.bar}%"></i></div>` : ""}`).join("")}
        ${s.recap ? `<div class="recap">${s.recap}</div>` : ""}
      </div>
    </div>`).join("");
}

function render() { renderThreads($("#searchInput").value); renderFeed(); renderPanel(); }

/* ============================================================
   INTERACTIONS
   ============================================================ */
$("#threads").addEventListener("click", e => {
  const el = e.target.closest(".thread"); if (!el) return;
  openThread(+el.dataset.id);
});
function openThread(id) {
  activeId = id; view = "chats";
  const t = threads.find(t => t.id === activeId); if (t) t.unread = false;
  render();
}
function goHome() {
  view = "home"; render();
  $("#main").scrollTo({ top: 0, behavior: "smooth" });
  setTimeout(() => $("#input").focus(), 60);
}
$("#feed").addEventListener("click", e => { e.target.closest(".tool")?.classList.toggle("open"); });
$("#rightPanel").addEventListener("click", e => {
  const h = e.target.closest(".sec-head"); if (h) h.parentElement.classList.toggle("collapsed");
});
if ($("#searchBtn")) $("#searchBtn").onclick = () => { $("#sbSearch").classList.toggle("open"); $("#searchInput").focus(); };
$("#searchInput").oninput = e => renderThreads(e.target.value);
$("#toggleSidebar").onclick = () => $("#app").classList.toggle("no-sidebar");
$("#toggleRight").onclick = () => $("#app").classList.toggle("no-right");
$("#newThread").onclick = goHome;
$("#homeBtn").onclick = goHome;
$("#chatsBtn").onclick = () => { view = "chats"; render(); };
document.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key === "n") { e.preventDefault(); $("#newThread").click(); }
  if ((e.metaKey || e.ctrlKey) && e.key === "b") { e.preventDefault(); $("#toggleSidebar").click(); }
  if ((e.metaKey || e.ctrlKey) && e.key === ".") { e.preventDefault(); $("#toggleRight").click(); }
  if ((e.metaKey || e.ctrlKey) && e.key === "k") { e.preventDefault(); $("#sbSearch").classList.toggle("open"); $("#searchInput").focus(); }
});

// Composer: auto-grow + fake agent reply
const input = $("#input");
input.addEventListener("input", () => {
  input.style.height = "auto"; input.style.height = input.scrollHeight + "px";
  $("#sendBtn").classList.toggle("ready", !!input.value.trim());
});
input.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });
$("#sendBtn").onclick = () => {
  const blocks = transcripts[ckey()];
  if (view !== "home" && blocks.at(-1)?.type === "thinking") { blocks.pop(); blocks.push({ type: "text", text: "<em style='color:var(--text-3)'>Stopped.</em>" }); markRunning(false); renderFeed(); }
  else send();
};
function markRunning(on) { const t = threads.find(t => t.id === activeId); t.running = on; renderThreads($("#searchInput").value); }

function send() {
  const text = input.value.trim(); if (!text) return;
  if (view === "home") {   // a prompt from Home starts a new thread and moves you to Chats
    const nid = Math.max(...threads.map(t => t.id)) + 1;
    const slug = text.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 24) || "task";
    const repo = window.forgeCtx?.project || "tako";
    threads.unshift({ id: nid, group: "Today", title: text.slice(0, 40), repo, pr: 2150 + nid, prState: "draft", branch: `${repo}/${slug}` });
    transcripts[nid] = []; activeId = nid; chatKey = null; view = "chats"; render();
  }
  const id = ckey(), blocks = transcripts[id];
  if (blocks.at(-1)?.type === "thinking") blocks.pop();
  const t = threads.find(t => t.id === activeId);
  if (t.title === "New thread") t.title = text.slice(0, 40);
  blocks.push({ type: "user", text: text.replace(/</g, "&lt;") }, { type: "thinking" });
  input.value = ""; input.style.height = "auto"; $("#sendBtn").classList.remove("ready");
  markRunning(true); renderFeed(); renderPanel();

  const steps = [
    { type: "text", text: "On it. Looking at the relevant files first." },
    { type: "tool", label: "Read 3 files", body: "src/components/Panel.tsx\nsrc/state/agents.ts\nsrc/styles/tokens.css" },
    { type: "tool", label: "Edited src/components/Panel.tsx", body: '<span class="ok">+ 18</span> <span class="err">− 4</span>' },
    { type: "text", text: "Done. The change is in place and the existing tests still pass." },
  ];
  steps.forEach((s, i) => setTimeout(() => {
    const b = transcripts[id]; if (b.at(-1)?.type !== "thinking") return; // stopped
    b.splice(b.length - 1, 0, s);

    const rows = ["...bbbb...", "..bhbbbb..", ".bhbbbbbb.", ".bbbbbbbb.", ".bwkbbwkb.", ".bbbbbbbb.", "..bbbbbb..", ".b.bb.bb.b", "b..b..b..b", ".........."];

      Object.keys(node).filter(k => k !== "__f").sort().forEach(dir => {
        const path = base ? base + "/" : ""; const full = path + dir, isOpen = openDirs.has(full);
        const dirty = CHANGES.some(f => !st.done.has(f.path) && f.path.startsWith(full + "/"));
        rows.push(`<div class="ft-row dir ${isOpen ? "open" : ""}" data-dir="${full}" style="--d:${d}">${ic("i-chev-d", "chev")}${ic("i-folder", "fo")}<span class="nm">${dir}</span>${dirty ? '<i class="dirty"></i>' : ""}</div>`);
        if (isOpen) walk(node[dir], full, d + 1);
      });
      (node.__f || []).sort().forEach(f => {
        const full = (base ? base + "/" : "") + f, s = status(full), on = act && ((act.type === "editor" && act.file === full) || (act.type === "markdown" && full.endsWith(act.file || "PLAN.md")));
        rows.push(`<div class="ft-row file ${on ? "on" : ""} ${s ? "chg-" + s : ""}" data-file="${full}" style="--d:${d}">${ic(fileIcon(full), "fi")}<span class="nm">${f}</span>${s ? `<span class="st st-${s}">${s}</span>` : ""}</div>`);
      });
    };
    walk(root, "", 0);
    return rows.join("");
  }
  // Actions: the worktree's scripts and dev servers
  const ACTIONS = [
    { id: "dev", name: "Dev server", cmd: "bun run dev", server: true, port: 3000 },
    { id: "test", name: "Test", cmd: "bun test", ok: "6153 passed", ms: 2400 },
    { id: "typecheck", name: "Typecheck", cmd: "tsc --noEmit", ok: "No errors", ms: 1700 },
    { id: "lint", name: "Lint", cmd: "bun run lint", ok: "Clean", ms: 1100 },
    { id: "build", name: "Build", cmd: "bun run build", ok: "1.84 MB · 3.1s", ms: 3100 },
    { id: "storybook", name: "Storybook", cmd: "bun run storybook", server: true, port: 6006 },
  ];
  const AS = {};
  const as = () => AS[activeId] ??= { dev: { state: "live", since: Date.now() - 41 * 60e3 } };
  function actionsHTML() {
    const S = as();
    return `<div class="act-list">${ACTIONS.map(a => {
      const s = S[a.id] || { state: "idle" };

      return `<div class="act ${s.state}" data-act-id="${a.id}">${btn}<div class="ai"><span class="an">${a.name}</span><code>${a.cmd}</code></div>${status}</div>`;

  }
  const scmRender = renderPanel;
  renderPanel = function () {
    if (rpView === "scm") return scmRender();
    const t = thread();
    document.getElementById("rightPanel").innerHTML = rpBar() + (rpView === "files"
      ? `<div class="rp"><div class="rp-vh"><span>${esc(t.repo)}</span><code>${esc(t.branch)}</code><span class="sp"></span><button class="ib" data-collapse title="Collapse folders">${ic("i-minus")}</button></div><div class="ft">${treeHTML()}</div></div>`

  };
  window.forgeOpenFile = path => {
    const S = tabsFor(activeId), act = S.list.find(x => x.id === S.active);
    if (/\.md$/.test(path)) { const name = path.split("/").pop(), ex = S.list.find(x => x.type === "markdown" && (x.file || "PLAN.md") === name); return ex ? activate(ex.id) : open("markdown", { file: name }); }
    const ex = S.list.find(x => x.type === "editor" && x.file === path); if (ex) return activate(ex.id);

  document.getElementById("rightPanel").addEventListener("click", e => {

    }
    if ((x = e.target.closest("[data-stop]"))) { as()[x.dataset.stop] = { state: "idle" }; return renderPanel(); }
    if ((x = e.target.closest(".act.live .as"))) return open("browser", { url: x.textContent.trim() });

  // Markdown: preview ⇄ source, live
  VIEWS.markdown = tab => {
    const t = thread();
    const SRC = `# ${t.title}

Plan the agent is working from. Edit it and the agent picks up changes on its next step.

## Goals
- [x] Only render dividers for **worked for** summaries
- [x] Regression test for resumed headers
- [ ] Update the PR description with before/after screenshots

## Notes
> Resumed headers shouldn't carry a divider — it reads like the conversation ended.

The fix lives in \`Timeline.tsx\`:

\`\`\`tsx
const showDivider = g.kind === "worked-for";
\`\`\`

## Done when
1. \`bun run check\` passes
2. PR #${t.pr} is green and ready for review
`;
    const el = div("tv tv-md", `<div class="md-bar"><span>${ic("i-doc")}${esc(tab.file || "PLAN.md")}</span><div class="bz-seg"><button class="on" data-m="preview">Preview</button><button data-m="split">Split</button><button data-m="source">Source</button></div></div>

    const ta = el.querySelector("textarea"), out = el.querySelector(".md-out"), body = el.querySelector(".md-body");
    const inline = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/\*([^*]+)\*/g, "<i>$1</i>").replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="#">$1</a>');
    function render() {
      let h = "", code = null, list = null;
