      for (const line of ta.value.split("\n")) {
        if (line.startsWith("```")) { if (code === null) { endList(); code = ""; } else { h += `<pre>${hl(code.replace(/\n$/, ""))}</pre>`; code = null; } continue; }
        if (code !== null) { code += line + "\n"; continue; }
        let m;
        if ((m = line.match(/^(#{1,3}) (.*)/))) { endList(); h += `<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`; }
        else if ((m = line.match(/^- \[( |x)\] (.*)/))) { if (list !== "ul") { endList(); h += '<ul class="tasks">'; list = "ul"; } h += `<li><input type="checkbox" ${m[1] === "x" ? "checked" : ""}/> ${inline(m[2])}</li>`; }
        else if ((m = line.match(/^[-*] (.*)/))) { if (list !== "ul") { endList(); h += "<ul>"; list = "ul"; } h += `<li>${inline(m[1])}</li>`; }
        else if ((m = line.match(/^\d+\. (.*)/))) { if (list !== "ol") { endList(); h += "<ol>"; list = "ol"; } h += `<li>${inline(m[1])}</li>`; }
        else if ((m = line.match(/^> (.*)/))) { endList(); h += `<blockquote>${inline(m[1])}</blockquote>`; }
        else if (!line.trim()) endList();
        else { endList(); h += `<p>${inline(line)}</p>`; }
      }
      endList(); out.innerHTML = h;
    }
    ta.value = SRC; render();
    ta.addEventListener("input", render);
    out.addEventListener("change", e => {                       // ticking a box in preview edits the source
      const boxes = [...out.querySelectorAll('input[type="checkbox"]')], i = boxes.indexOf(e.target); let k = -1;
      ta.value = ta.value.replace(/^- \[( |x)\]/gm, s => (++k === i ? `- [${e.target.checked ? "x" : " "}]` : s));
    });
    el.querySelector(".bz-seg").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; el.querySelectorAll(".bz-seg button").forEach(x => x.classList.toggle("on", x === b)); body.dataset.mode = b.dataset.m; });
    return el;
  };

  // Whiteboard: smooth pen strokes, sticky notes you can drag and edit
  VIEWS.whiteboard = tab => {
    const el = div("tv tv-wb", `<canvas></canvas>
      <div class="wb-tools">
        <button class="on" data-tool="pen" title="Pen">${ic("i-pen")}</button><button data-tool="hl" title="Highlighter">${ic("i-edit")}</button>
        <button data-tool="sticky" title="Sticky note">${ic("i-sticky")}</button><span class="sep"></span>
        ${["var(--text)", "var(--accent)", "#5fc48a", "#7aa7e8"].map((c, i) => `<button class="sw ${i ? "" : "on"}" data-color="${c}" style="--c:${c}"></button>`).join("")}
        <span class="sep"></span><button data-tool="clear" title="Clear">${ic("i-eraser")}</button>
      </div>
      <div class="wb-hint">Draw anywhere · double-click for a note</div>`);
    const cv = el.querySelector("canvas"), g = cv.getContext("2d"), strokes = [];
    let tool = "pen", color = "var(--text)", cur = null;
    const resolve = c => c.startsWith("var(") ? getComputedStyle(el).getPropertyValue(c.slice(4, -1)).trim() : c;
    function size() { const r = el.getBoundingClientRect(), d = devicePixelRatio || 1; if (!r.width) return; cv.width = r.width * d; cv.height = r.height * d; g.setTransform(d, 0, 0, d, 0, 0); redraw(); }
    function drawStroke(s) {
      const p = s.pts; if (p.length < 2) return;
      g.strokeStyle = resolve(s.color); g.globalAlpha = s.tool === "hl" ? 0.28 : 1; g.lineWidth = s.tool === "hl" ? 16 : 2.4; g.lineCap = g.lineJoin = "round";
      g.beginPath(); g.moveTo(p[0][0], p[0][1]);
      for (let i = 1; i < p.length - 1; i++) g.quadraticCurveTo(p[i][0], p[i][1], (p[i][0] + p[i + 1][0]) / 2, (p[i][1] + p[i + 1][1]) / 2);
      g.lineTo(p.at(-1)[0], p.at(-1)[1]); g.stroke(); g.globalAlpha = 1;
    }
    function redraw() { g.clearRect(0, 0, cv.width, cv.height); strokes.forEach(drawStroke); }
    const xy = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
    cv.addEventListener("pointerdown", e => { if (tool === "sticky") { note(...xy(e)); return; } cv.setPointerCapture(e.pointerId); cur = { tool, color, pts: [xy(e)] }; strokes.push(cur); });
    cv.addEventListener("pointermove", e => { if (!cur) return; cur.pts.push(xy(e)); redraw(); });
    cv.addEventListener("pointerup", () => { cur = null; });
    cv.addEventListener("dblclick", e => note(...xy(e)));
    function note(x, y, text = "New note", hue = "var(--accent)") {
      const n = div("wb-note", `<div class="wb-grip"></div><div class="wb-text" contenteditable="true" spellcheck="false">${text}</div>`);
      n.style.left = x - 80 + "px"; n.style.top = y - 20 + "px"; n.style.setProperty("--n", hue); el.appendChild(n);
      const grip = n.querySelector(".wb-grip");
      grip.addEventListener("pointerdown", e => { grip.setPointerCapture(e.pointerId); const ox = e.clientX - n.offsetLeft, oy = e.clientY - n.offsetTop;
        const mv = ev => { n.style.left = ev.clientX - ox + "px"; n.style.top = ev.clientY - oy + "px"; };
        grip.addEventListener("pointermove", mv); grip.addEventListener("pointerup", () => grip.removeEventListener("pointermove", mv), { once: true }); });
      if (text === "New note") { const t = n.querySelector(".wb-text"); setTimeout(() => { t.focus(); getSelection().selectAllChildren(t); }, 0); }
      tool = "pen"; el.querySelectorAll("[data-tool]").forEach(b => b.classList.toggle("on", b.dataset.tool === "pen"));
    }
    el.querySelector(".wb-tools").addEventListener("click", e => {
      const b = e.target.closest("button"); if (!b) return;
      if (b.dataset.tool === "clear") { strokes.length = 0; redraw(); el.querySelectorAll(".wb-note").forEach(n => n.remove()); return; }
      if (b.dataset.tool) { tool = b.dataset.tool; el.querySelectorAll("[data-tool]").forEach(x => x.classList.toggle("on", x === b)); }
      if (b.dataset.color) { color = b.dataset.color; el.querySelectorAll(".sw").forEach(x => x.classList.toggle("on", x === b)); }
    });
    let seeded = false;
    el.addEventListener("tab-shown", () => requestAnimationFrame(() => {
      size();
      if (!seeded) { seeded = true; const r = el.getBoundingClientRect();
        note(r.width * 0.3, r.height * 0.3, "Resumed header<br>→ no divider", "#e2b75a");
        note(r.width * 0.62, r.height * 0.42, "“Worked for” summary<br>→ keeps divider", "#5fc48a");
        strokes.push({ tool: "pen", color: "var(--accent)", pts: Array.from({ length: 24 }, (_, i) => [r.width * 0.39 + i * r.width * 0.0095, r.height * 0.36 + Math.sin(i / 23 * Math.PI) * -36 + i * 2.2]) });
        redraw(); }
    }));
    new ResizeObserver(() => el.isConnected && size()).observe(el);
    return el;
  };

  // Emulator: a generic device running the session's app
  VIEWS.emulator = tab => {
    const el = div("tv tv-emu", `
      <div class="emu-bar"><div class="bz-seg"><button class="on" data-dev="phone">Phone</button><button data-dev="tablet">Tablet</button></div>
        <button class="ib" data-act="rotate" title="Rotate">${ic("i-rotate")}</button><button class="ib" data-act="reload" title="Reload app">${ic("i-reload")}</button>
        <span class="emu-st"><i></i>Hot reload on · Tako (debug)</span></div>

          <div class="app-card" style="--i:${i}"><div><b>${x}</b><small>${i < 3 ? `step ${3 + i} of 7` : "Ready for review"}</small></div>
          ${i < 3 ? `<div class="app-bar"><i style="animation-delay:-${i * 0.8}s"></i></div>` : '<span class="app-ok">✓</span>'}</div>`).join("")}
        <div class="app-tabbar"><span class="on">●</span><span>○</span><span>○</span></div>
      </div></div></div>`);
    const dev = el.querySelector(".emu-dev");
    el.querySelector(".emu-bar").addEventListener("click", e => {
      const b = e.target.closest("button"); if (!b) return;
      if (b.dataset.dev) { el.querySelectorAll("[data-dev]").forEach(x => x.classList.toggle("on", x === b)); dev.classList.remove("phone", "tablet"); dev.classList.add(b.dataset.dev); }
      if (b.dataset.act === "rotate") dev.classList.toggle("land");
      if (b.dataset.act === "reload") { dev.classList.remove("boot"); void dev.offsetWidth; dev.classList.add("boot"); }
    });
    return el;
  };

  function build(tab) { building = true; try { return (VIEWS[tab.type] || VIEWS.newtab)(tab); } finally { building = false; setTimeout(renderBar); } }

  render();
})();

<script>
/* ============================================================
   USAGE — Claude + Codex limits across several accounts each.
   Rings in the rail show the account in use; hover for every account.
   ============================================================ */
(() => {
  const ic = (id, cls = "") => `<svg class="${cls}"><use href="#${id}"/></svg>`;
  const esc = s => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  const PROV = {
    claude: { name: "Claude", cli: "Claude Code", mark: "i-spark", color: "var(--accent)", ring: "c", plans: ["Pro", "Max 5×", "Max 20×", "Team"] },
    codex: { name: "Codex", cli: "Codex CLI", mark: "i-code", color: "var(--blue)", ring: "x", plans: ["Plus", "Pro", "Business"] },
  };
  const SEED = {
    auto: true,
    accounts: [
      { id: "c1", p: "claude", label: "Personal", plan: "Max 20×", synced: "just now", win: [["5-hour", 100, "resets 15:26"], ["Week", 60, "resets Mon 09:00"], ["Opus · week", 41, "resets Mon 09:00"]] },
      { id: "c2", p: "claude", label: "Work", plan: "Team", synced: "2 min ago", win: [["5-hour", 18, "resets 17:02"], ["Week", 34, "resets Sat 22:00"]] },
      { id: "x1", p: "codex", label: "Personal", plan: "Plus", synced: "just now", win: [["5-hour", 42, "resets 15:26"], ["Week", 23, "resets Thu 14:00"]], note: "2 free full resets · next expires Thu 29 Oct" },
      { id: "x2", p: "codex", label: "Acme client", plan: "Pro", synced: "18 h ago", win: [["5-hour", 0, "resets 19:40"], ["Week", 8, "resets Mon 10:26"]] },
    ],
    active: { claude: "c2", codex: "x1" },
  };
  let S; try { S = JSON.parse(localStorage.getItem("forge-usage")) || SEED; } catch { S = SEED; }
  const save = () => { try { localStorage.setItem("forge-usage", JSON.stringify(S)); } catch {} };
  const accts = p => S.accounts.filter(a => a.p === p);
  const active = p => S.accounts.find(a => a.id === S.active[p]) || accts(p)[0];
  const week = a => (a?.win.find(w => w[0] === "Week") || a?.win[0] || [0, 0])[1];
  const capped = a => a.win.some(w => w[1] >= 100);
  const listeners = new Set();
  const openSet = new Set();
  const changed = () => { save(); paintRings(); if (pop.classList.contains("open")) paint(false); listeners.forEach(f => f()); };

  const btn = document.getElementById("usageBtn"), pop = document.createElement("div");
  pop.className = "usage-pop"; pop.id = "usagePop"; document.body.appendChild(pop);
  const R = [13, 8.5];
  btn.innerHTML = `<svg class="u-rings" viewBox="0 0 36 36">${Object.values(PROV).map((p, i) => `
    <circle class="trk" cx="18" cy="18" r="${R[i]}"/><circle class="${p.ring}" cx="18" cy="18" r="${R[i]}" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/>`).join("")}</svg>`;
  function paintRings() {
    Object.entries(PROV).forEach(([k, p]) => { const a = active(k); btn.querySelector("." + p.ring).style.strokeDashoffset = 100 - (a ? week(a) : 0); });
    btn.classList.toggle("hot", Object.keys(PROV).some(k => active(k) && capped(active(k))));
  }
  requestAnimationFrame(() => setTimeout(paintRings, 300));

  const bar = (v, c) => `<div class="ub"><i data-w="${Math.min(100, v)}" class="${v >= 100 ? "max" : ""}" style="${c ? `--m:${c}` : ""}"></i></div>`;
  function acctHTML(a, k) {
    const on = S.active[k] === a.id, full = capped(a), open = on || openSet.has(a.id), wk = week(a);
    if (!open) return `<div class="ua mini ${full ? "full" : ""}" data-acct="${a.id}">
      <div class="ua-h" data-expand="${a.id}"><button class="ua-pick" data-use="${a.id}" title="Use this account"><i></i></button>
        <div class="ua-t"><b>${esc(a.label)}</b><small>${esc(a.plan)} · ${full ? "limit reached" : "updated " + a.synced}</small></div>
        <div class="ua-mini">${bar(wk)}<b class="${wk >= 100 ? "max" : ""}">${wk}%</b></div></div></div>`;
    return `<div class="ua ${on ? "on" : ""} ${full ? "full" : ""}" data-acct="${a.id}">
      <div class="ua-h" ${on ? "" : `data-expand="${a.id}"`}><button class="ua-pick" data-use="${a.id}" title="${on ? "In use for new sessions" : "Use this account"}"><i></i></button>
        <div class="ua-t"><b>${esc(a.label)}</b><small>${esc(PROV[k].cli)} · ${esc(a.plan)}</small></div>
        <span class="ua-s">${full ? "limit reached" : on ? "in use" : "updated " + a.synced}</span></div>
      ${a.win.map(([l, v, r]) => `<div class="uw"><div class="uw-l"><span>${l}</span><small>${r}</small></div>${bar(v)}<b class="${v >= 100 ? "max" : ""}">${v}%</b></div>`).join("")}
      ${a.note ? `<div class="ua-note">${ic("i-spark")}${esc(a.note)}</div>` : ""}
    </div>`;
  }
  function paint(anim = true) {
    pop.innerHTML = `<div class="up-head"><span>Usage</span><button class="up-ref" data-refresh title="Refresh">${ic("i-refresh")}<small>synced just now</small></button></div>
      ${Object.entries(PROV).map(([k, p]) => { const list = accts(k), sw = S.auto && list.length > 1 && list.find(a => a.id !== S.active[k] && capped(a));
        return `<section class="up-prov" style="--m:${p.color}">
        <div class="up-name"><span class="mk">${ic(p.mark)}</span><b>${p.name}</b><small>${list.length} account${list.length === 1 ? "" : "s"}</small>
          <button class="up-add" data-add="${k}" title="Add ${p.name} account">${ic("i-plus")}</button></div>
        ${sw ? `<div class="up-swap">${esc(sw.label)} hit its limit, so new sessions use ${esc(active(k).label)}.</div>` : ""}
        ${list.map(a => acctHTML(a, k)).join("")}
        <div class="up-new" data-new="${k}" hidden><input placeholder="Account name, e.g. Side project" maxlength="24"/>
          <select>${p.plans.map(x => `<option>${x}</option>`).join("")}</select><button data-sign="${k}">Sign in</button></div>
      </section>`; }).join("")}
      <div class="up-foot"><label class="up-auto"><span>Switch accounts when a limit is hit</span><button class="tgl ${S.auto ? "on" : ""}" data-auto role="switch" aria-checked="${S.auto}"><i></i></button></label></div>`;
    pop.querySelectorAll(".ub i").forEach(i => {
      if (!anim) { i.style.width = i.dataset.w + "%"; return; }
      i.style.width = "0"; requestAnimationFrame(() => requestAnimationFrame(() => { i.style.width = i.dataset.w + "%"; }));
    });
  }
  pop.addEventListener("click", e => {
    const d = a => e.target.closest(`[${a}]`); let x;

  }
  const pp = document.getElementById("pagePlugins");
  pp.addEventListener("input", e => { if (e.target.id === "plSearch") { pq = e.target.value; renderPlugins(); const s = document.getElementById("plSearch"); s.focus(); s.setSelectionRange(s.value.length, s.value.length); } });
  pp.addEventListener("click", e => {
    const d = k => e.target.closest(`[${k}]`); let x;
    if ((x = d("data-inst"))) { const id = x.dataset.inst; installed.has(id) ? installed.delete(id) : installed.add(id); store("forge-plugins", [...installed]); return renderPlugins(); }

})();
</script>
<script>

  /* ---- data ---- */
  const LABEL_COLORS = ["#7aa7e8", "#5fc48a", "#e2b75a", "#c77dff", "#ec7aa0", "#4fb3c8", "#e5675f", "#9aa3b0"];
  const LABELS = load("forge-labels", { work: { name: "Work", c: "#7aa7e8" }, personal: { name: "Personal", c: "#5fc48a" }, oss: { name: "Open source", c: "#e2b75a" }, client: { name: "Client", c: "#c77dff" }, maint: { name: "Maintenance", c: "#9aa3b0" } });

      LABELS[id] = { name: name.trim().slice(0, 24), c: c || LABEL_COLORS[Object.keys(LABELS).length % LABEL_COLORS.length] };
      store("forge-labels", LABELS); renderThreads(document.getElementById("searchInput").value); return id;

  };
  let projects = load("forge-projects", {
    tako: { name: "tako", icon: "octo", label: "work" },
    api: { name: "api", icon: "robot", label: "work" },
    web: { name: "web", icon: "planet", label: "oss" },
  });
  threads.push(
    { id: 10, group: "Today", title: "Docs search ranking", repo: "web", pr: 91, prState: "open", branch: "web/docs-search" },
    { id: 11, group: "Last week", title: "Landing page hero", repo: "web", pr: 88, prState: "closed", branch: "web/hero-refresh" },

  // last activity (minutes ago) and uncommitted changes per worktree
  const META = { 1: [0, 20, 12], 2: [4, 6, 2], 3: [180, 0, 0], 4: [52, 31, 9], 5: [1440 * 2, 14, 3], 6: [600, 0, 0], 7: [95, 48, 6], 8: [1440 * 6, 0, 0], 9: [1440 * 5, 9, 4], 10: [12, 22, 5], 11: [1440 * 8, 0, 0] };
  const t0 = Date.now();

  let groupBy = load("forge-groupby", "project"), collapsed = new Set(load("forge-collapsed", [])), menu = null, picker = null, renaming = null;
  let newLabelFor = null, newName = "", newColor = 0;
  const saveP = () => { store("forge-projects", projects); window.renderFeed && renderFeed(); };
  window.forgeProjects = () => projects;

  /* ---- New project dialog ---- */
  const np = document.createElement("div"); np.className = "np-scrim"; np.hidden = true; document.body.appendChild(np);
  const SRC = [["folder", "i-folder", "Open a folder", "A repository already on this machine"], ["clone", "i-github", "Clone a repository", "From GitHub or any git URL"], ["empty", "i-plus", "Start from scratch", "A new, empty git repository"]];
  let N = null;
  function npOpen() { N = { src: "folder", name: "", path: "~/code/", url: "", icon: ICON_IDS[(Object.keys(projects).length * 5) % ICON_IDS.length], label: "" }; np.hidden = false; npRender(); requestAnimationFrame(() => np.classList.add("in")); }
  function npClose() { np.classList.remove("in"); setTimeout(() => { np.hidden = true; }, 180); }
  const slug = v => v.trim().toLowerCase().replace(/[^a-z0-9._-]+/g, "-").replace(/^-+|-+$/g, "");
  const guess = () => N.src === "clone" ? (N.url.split("/").pop() || "").replace(/\.git$/, "") : N.src === "folder" ? (N.path.replace(/\/+$/, "").split("/").pop() || "").replace(/^~$/, "") : "";
  function npRender() {
    const nm = N.name || guess();
    np.innerHTML = `<div class="np" role="dialog" aria-label="New project">
      <div class="np-h"><b>New project</b><button class="ib" data-npx title="Close">${ic("i-x")}</button></div>
      <div class="np-src">${SRC.map(([k, i, t, d]) => `<button class="${N.src === k ? "on" : ""}" data-src="${k}">${ic(i)}<span><b>${t}</b><small>${d}</small></span></button>`).join("")}</div>
      ${N.src === "folder" ? `<label class="np-f"><span>Folder</span><div class="np-in">${ic("i-folder")}<input data-k="path" value="${esc(N.path)}" spellcheck="false"/><button class="btn sm" data-browse>Browse…</button></div></label>` : ""}
      ${N.src === "clone" ? `<label class="np-f"><span>Repository URL</span><div class="np-in">${ic("i-github")}<input data-k="url" value="${esc(N.url)}" placeholder="github.com/org/repo" spellcheck="false"/></div></label>` : ""}
      <label class="np-f"><span>Name</span><div class="np-in"><button class="np-ic" data-npick title="Change icon">${pix(N.icon)}</button><input data-k="name" value="${esc(N.name)}" placeholder="${esc(guess() || "my-project")}" spellcheck="false"/></div></label>
      ${N.picking ? `<div class="pj-pick np-pick">${ICON_IDS.map(id => `<button class="${N.icon === id ? "on" : ""}" data-npicon="${id}" title="${id}">${pix(id)}</button>`).join("")}</div>` : ""}
      <div class="np-f"><span>Label</span><div class="np-lbs"><button class="${!N.label ? "on" : ""}" data-nplabel="">None</button>${Object.entries(LABELS).map(([k, l]) => `<button class="${N.label === k ? "on" : ""}" data-nplabel="${k}"><i style="--c:${l.c}"></i>${esc(l.name)}</button>`).join("")}</div></div>
      <div class="np-foot"><small>${N.src === "clone" ? "Clones onto the machine picked in the composer." : N.src === "empty" ? "Runs git init in ~/code/" + esc(slug(nm) || "my-project") : "Nothing is copied. Worktrees are created next to it."}</small>
        <button class="btn sm" data-npx>Cancel</button><button class="btn sm primary" data-npok ${slug(nm) ? "" : "disabled"}>Create project</button></div>
    </div>`;
  }
  np.addEventListener("input", e => {
    const k = e.target.dataset.k; if (!k) return; N[k] = e.target.value;
    const nm = N.name || guess(), ok = np.querySelector("[data-npok]"); if (ok) ok.disabled = !slug(nm);
    const ph = np.querySelector('[data-k="name"]'); if (ph && k !== "name") ph.placeholder = guess() || "my-project";
  });
  np.addEventListener("keydown", e => { if (e.key === "Escape") npClose(); if (e.key === "Enter" && e.target.matches("input")) np.querySelector("[data-npok]:not([disabled])")?.click(); });
  np.addEventListener("click", e => {
    const d = a => e.target.closest(`[${a}]`); let x;
    if (e.target === np || d("data-npx")) return npClose();
    if ((x = d("data-src"))) { N.src = x.dataset.src; npRender(); return np.querySelector(`[data-k="${N.src === "clone" ? "url" : N.src === "folder" ? "path" : "name"}"]`)?.focus(); }
    if (d("data-browse")) { N.path = "~/code/side-quest"; return npRender(); }
    if (d("data-npick")) { N.picking = !N.picking; return npRender(); }
    if ((x = d("data-npicon"))) { N.icon = x.dataset.npicon; N.picking = false; return npRender(); }

    if (d("data-npok")) {
      const name = slug(N.name || guess()); if (!name) return;
      let id = name, i = 2; while (projects[id]) id = name + "-" + i++;

      requestAnimationFrame(() => { const el = document.querySelector(`[data-pj="${id}"]`); if (el) { el.scrollIntoView({ block: "nearest" }); el.classList.add("pj-new"); setTimeout(() => el.classList.remove("pj-new"), 1600); } });

  document.getElementById("newProject").onclick = npOpen;
  const ago = ms => { const m = Math.floor((Date.now() - ms) / 60000); return m < 1 ? "now" : m < 60 ? m + "m" : m < 1440 ? Math.floor(m / 60) + "h" : Math.floor(m / 1440) + "d"; };
  const PR = { open: ["Open", "i-pr"], draft: ["Draft", "i-pr"], merged: ["Merged", "i-pr"], closed: ["Closed", "i-pr"] };

  function row(t) {

        <span class="wt-pr ${t.prState}" title="PR #${t.pr} · ${PR[t.prState][0]}">${ic("i-pr")}#${t.pr}</span></div>
    </div>`;
  }
  function projectBlock(pid, list) {
    const p = projects[pid] || (projects[pid] = { name: pid, icon: "star", label: null }), L = LABELS[p.label], open = !collapsed.has(pid);
    return `<div class="pj ${open ? "" : "shut"}" data-pj="${pid}">
      <div class="pj-h">
        <button class="pj-ic" data-pick="${pid}" title="Change icon">${pix(p.icon)}</button>
        ${renaming === pid ? `<input class="pj-rn" id="pjRename" value="${esc(p.name)}" spellcheck="false"/>` : `<span class="pj-n" data-fold="${pid}" title="Double-click to rename">${esc(p.name)}</span>`}
        ${L && groupBy !== "label" ? `<span class="pj-lb" style="--c:${L.c}">${L.name}</span>` : ""}
        ${selMode && list.length ? `<button class="pj-all" data-selpj="${pid}">${list.every(t => sel.has(t.id)) ? "None" : "All"}</button>` : `<span class="pj-c">${list.length}</span>`}
        <button class="ib pj-m" data-menu="${pid}" title="Project options">${ic("i-dots")}</button>
        <button class="ib pj-f" data-fold="${pid}" title="${open ? "Collapse" : "Expand"}">${ic("i-chev-d")}</button>
      </div>
      ${menu === pid ? `<div class="pj-menu">
        <button data-rename="${pid}">${ic("i-edit")}Rename</button><button data-pick="${pid}">${pix(p.icon)}Change icon</button>
        <div class="pj-mlab">Label</div>${Object.entries(LABELS).map(([k, l]) => `<button data-label="${k}" data-for="${pid}"><i style="--c:${l.c}"></i>${l.name}${p.label === k ? ic("i-check", "ck2") : ""}</button>`).join("")}
        <button data-label="" data-for="${pid}"><i></i>No label${!p.label ? ic("i-check", "ck2") : ""}</button>
        ${newLabelFor === pid ? `<div class="lb-new"><input id="lbNew" placeholder="Label name" maxlength="24" spellcheck="false"/>
          <div class="lb-cols">${LABEL_COLORS.map((c, i) => `<button class="${i === newColor ? "on" : ""}" data-lcol="${i}" style="--c:${c}" title="Colour"></button>`).join("")}</div>
          <div class="lb-act"><button data-lcancel>Cancel</button><button class="go" data-lsave="${pid}">Add label</button></div></div>`

      ${picker === pid ? `<div class="pj-pick">${ICON_IDS.map(id => `<button class="${p.icon === id ? "on" : ""}" data-icon="${id}" data-for="${pid}" title="${id}">${pix(id)}</button>`).join("")}</div>` : ""}
      ${open ? `<div class="pj-list">${list.map(row).join("") || `<div class="pj-none">${document.getElementById("searchInput").value ? "No worktrees match" : "No chats yet"}</div>`}</div>` : ""}
    </div>`;
  }
  // Smooth fold: collapse animates the live list shut before re-rendering; expand re-renders, then grows the new list open.
  const EASE = "cubic-bezier(.2,.8,.2,1)", reduceFold = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let folding = false;
  function fold(pid, blk) {
    if (folding) return;
    const commit = () => { collapsed.has(pid) ? collapsed.delete(pid) : collapsed.add(pid); store("forge-collapsed", [...collapsed]); renderThreads($("#searchInput").value); };
    const listEl = blk && blk.querySelector(":scope > .pj-list");
    if (reduceFold || !blk) return commit();
    if (!collapsed.has(pid)) {                       // closing
      if (!listEl) return commit();
      folding = true; blk.classList.add("shut"); listEl.dataset.closing = "1";
      listEl.getAnimations({ subtree: true }).forEach(a => a.cancel());
      const h = listEl.offsetHeight; listEl.style.overflow = "hidden";
      [...listEl.children].forEach((r, i, a) => r.animate([{ opacity: 1, transform: "none" }, { opacity: 0, transform: "translateY(-4px)" }], { duration: 160, delay: (a.length - 1 - i) * 12, easing: "ease-in", fill: "forwards" }));
      const an = listEl.animate([{ height: h + "px", marginTop: "2px" }, { height: "0px", marginTop: "0px" }], { duration: 240 + Math.min(120, h / 6), easing: EASE, fill: "forwards" });
      let done = false; const fin = () => { if (done) return; done = true; folding = false; commit(); };

      nb?.querySelector(".pj-f svg")?.animate([{ transform: "rotate(-90deg)" }, { transform: "rotate(0deg)" }], { duration: 200, easing: EASE });
      if (!nl) return;
      const h = nl.offsetHeight; nl.style.overflow = "hidden";
      const an = nl.animate([{ height: "0px", marginTop: "0px" }, { height: h + "px", marginTop: "2px" }], { duration: 260 + Math.min(140, h / 5), easing: EASE });
      an.onfinish = an.oncancel = () => { if (!nl.dataset.closing) nl.style.overflow = ""; };
      [...nl.children].forEach((r, i) => r.animate([{ opacity: 0, transform: "translateY(-6px)" }, { opacity: 1, transform: "none" }], { duration: 260, delay: 30 + i * 22, easing: EASE, fill: "backwards" }));
    }
  }
  renderThreads = function (filter = "") {
    const q = filter.toLowerCase();
    threads.forEach(t => { t.last ??= Date.now(); t.wt ??= t.branch.split("/").pop(); t.add ??= 0; t.del ??= 0; });
    const vis = threads.filter(t => !q || (t.title + " " + t.branch + " " + t.wt + " " + (projects[t.repo]?.name || t.repo)).toLowerCase().includes(q)).sort((a, b) => b.last - a.last);
    const byProject = {}; vis.forEach(t => (byProject[t.repo] ??= []).push(t));
    const order = Object.keys(projects).filter(p => byProject[p] || !q);
    Object.keys(byProject).forEach(p => !order.includes(p) && order.push(p));
    let html;
    if (groupBy === "label") {
      const sections = {}; order.forEach(pid => (sections[projects[pid]?.label || ""] ??= []).push(pid));
      html = [...Object.keys(LABELS), ""].filter(k => sections[k]).map(k => `
        <div class="lb-sec"><div class="lb-h">${k ? `<i style="--c:${LABELS[k].c}"></i>${LABELS[k].name}` : "No label"}</div>${sections[k].map(pid => projectBlock(pid, byProject[pid] || [])).join("")}</div>`).join("");
    } else html = order.map(pid => projectBlock(pid, byProject[pid] || [])).join("");
    const el = document.getElementById("threads"); el.innerHTML = html;
    document.getElementById("sbGroup").innerHTML = `${ic(groupBy === "label" ? "i-list" : "i-folder")}Grouped by ${groupBy}<span class="sp"></span>${ic("i-sort")}`;
    if (renaming) { const i = document.getElementById("pjRename"); i.focus(); i.select(); }
    if (newLabelFor) { const i = document.getElementById("lbNew"); if (i) { i.value = newName; i.focus(); i.setSelectionRange(newName.length, newName.length); } }
  };


  /* ---- Multi-select and batch actions ---- */
  let selMode = false, lastSel = null, confirmDel = false, undoBuf = null;
  const sel = new Set();
  const visibleIds = () => [...document.querySelectorAll("#threads .wt")].map(w => +w.dataset.id);
  const rerender = () => { renderThreads($("#searchInput").value); paintBatch(); };
  function setSelMode(on) { selMode = on; if (!on) { sel.clear(); confirmDel = false; } $("#sidebarEl")?.classList.toggle("selecting", on); $("#sbSelect").classList.toggle("on", on); rerender(); }
  function toggleSel(id, range) {
    if (range && lastSel != null) { const ids = visibleIds(), a = ids.indexOf(lastSel), b = ids.indexOf(id); if (a > -1 && b > -1) ids.slice(Math.min(a, b), Math.max(a, b) + 1).forEach(i => sel.add(i)); }
    else sel.has(id) ? sel.delete(id) : sel.add(id);
    lastSel = id; confirmDel = false; if (!selMode) { selMode = true; $("#sbSelect").classList.add("on"); }
    rerender();
  }
  function archive(ids, verb = "Archived") {
    const gone = threads.filter(t => ids.includes(t.id));
    if (!gone.length) return;
    gone.forEach(t => threads.splice(threads.indexOf(t), 1));
    undoBuf = gone; sel.clear(); confirmDel = false; selMode = false; $("#sbSelect").classList.remove("on");
    if (gone.some(t => t.id === activeId) && view === "chats") { threads[0] ? openThread([...threads].sort((x, y) => (y.last || 0) - (x.last || 0))[0].id) : goHome(); }
    rerender(); snack(`${verb} ${gone.length} chat${gone.length > 1 ? "s" : ""}`, true);
  }
  function snack(msg, undo) {
    const b = $("#sbBatch"); b.hidden = false; b.className = "sb-batch snack";
    b.innerHTML = `<span class="sb-bn">${msg}</span>${undo ? `<button class="sb-ba" data-undo>Undo</button>` : ""}`;
    clearTimeout(snack.t); snack.t = setTimeout(() => { if (b.classList.contains("snack")) { b.hidden = true; undoBuf = null; } }, 5000);
  }
  function paintBatch() {
    const b = $("#sbBatch");
    if (!selMode) { if (!b.classList.contains("snack")) b.hidden = true; return; }
    clearTimeout(snack.t); b.className = "sb-batch"; b.hidden = false;
    const n = sel.size, list = threads.filter(t => sel.has(t.id)), anyRun = list.some(t => t.running), anyUnread = list.some(t => t.unread);
    if (confirmDel) {
      b.innerHTML = `<span class="sb-bn">Delete ${n} worktree${n > 1 ? "s" : ""}? Branches and PRs are kept.</span><button class="sb-ba" data-bcancel>Cancel</button><button class="sb-ba danger" data-bdelok>Delete</button>`;
      return;
    }
    b.innerHTML = `<span class="sb-bn">${n ? `${n} selected` : "Select chats"}</span>
      <button class="ib" data-bact="read" title="Mark as read" ${anyUnread ? "" : "disabled"}>${ic("i-inbox")}</button>
      <button class="ib" data-bact="stop" title="Stop agents" ${anyRun ? "" : "disabled"}>${ic("i-stop")}</button>
      <button class="ib" data-bact="archive" title="Archive" ${n ? "" : "disabled"}>${ic("i-archive")}</button>
      <button class="ib" data-bact="delete" title="Delete worktrees" ${n ? "" : "disabled"}>${ic("i-trash")}</button>
      <span class="sb-bsep"></span><button class="ib" data-bact="done" title="Done (Esc)">${ic("i-x")}</button>`;
  }
  $("#sbBatch").addEventListener("click", e => {
    const d = k => e.target.closest(`[${k}]`); let x;
    if (d("data-undo")) { if (undoBuf) { threads.push(...undoBuf); undoBuf = null; } $("#sbBatch").hidden = true; $("#sbBatch").className = "sb-batch"; return rerender(); }
    if (d("data-bcancel")) { confirmDel = false; return paintBatch(); }
    if (d("data-bdelok")) return archive([...sel], "Deleted worktrees for");
    if (!(x = d("data-bact")) || x.disabled) return;
    const a = x.dataset.bact, list = threads.filter(t => sel.has(t.id));
    if (a === "done") return setSelMode(false);
    if (a === "read") { list.forEach(t => t.unread = false); return rerender(); }
    if (a === "stop") { list.forEach(t => t.running = false); return rerender(); }
    if (a === "archive") return archive([...sel]);
    if (a === "delete") { confirmDel = true; return paintBatch(); }
  });
  $("#sbSelect").onclick = () => setSelMode(!selMode);
  document.addEventListener("keydown", e => {
    if (!selMode || e.target.matches("input, textarea, [contenteditable]")) return;
    if (e.key === "Escape") setSelMode(false);
    if ((e.metaKey || e.ctrlKey) && e.key === "a" && view === "chats") { e.preventDefault(); visibleIds().forEach(i => sel.add(i)); rerender(); }
  });
  window.forgeBatch = { archive: ids => archive(ids, "Cleaned up"), threads: () => threads };
  const list = document.getElementById("threads");
  list.addEventListener("click", e => {
    const d = k => e.target.closest(`[${k}]`); let x;
    if ((x = d("data-newlabel"))) { newLabelFor = x.dataset.newlabel; newName = ""; newColor = Object.keys(LABELS).length % LABEL_COLORS.length; return renderThreads($("#searchInput").value); }
    if ((x = d("data-lcol"))) { newColor = +x.dataset.lcol; return renderThreads($("#searchInput").value); }
    if (d("data-lcancel")) { newLabelFor = null; return renderThreads($("#searchInput").value); }
    if ((x = d("data-lsave"))) return saveNewLabel(x.dataset.lsave);
    if (e.target.id === "lbNew") return;
    if ((x = d("data-icon"))) { projects[x.dataset.for].icon = x.dataset.icon; picker = null; saveP(); return renderThreads($("#searchInput").value); }
    if ((x = d("data-pick"))) { picker = picker === x.dataset.pick ? null : x.dataset.pick; menu = null; return renderThreads($("#searchInput").value); }
    if ((x = d("data-menu"))) { menu = menu === x.dataset.menu ? null : x.dataset.menu; picker = null; newLabelFor = null; return renderThreads($("#searchInput").value); }
    if ((x = d("data-rename"))) { renaming = x.dataset.rename; menu = null; return renderThreads($("#searchInput").value); }
    if ((x = d("data-label"))) { projects[x.dataset.for].label = x.dataset.label || null; menu = null; saveP(); return renderThreads($("#searchInput").value); }
    if ((x = d("data-fold"))) return fold(x.dataset.fold, x.closest(".pj"));
    if ((x = d("data-selpj"))) { const ids = threads.filter(t => t.repo === x.dataset.selpj).map(t => t.id), all = ids.every(i => sel.has(i)); ids.forEach(i => all ? sel.delete(i) : sel.add(i)); return rerender(); }
    const w = e.target.closest(".wt"); if (w) { e.stopPropagation(); menu = picker = null; if (selMode || e.metaKey || e.ctrlKey || e.shiftKey) { e.preventDefault(); return toggleSel(+w.dataset.id, e.shiftKey); } openThread(+w.dataset.id); }
  }, true);
  list.addEventListener("mousedown", e => { if (e.shiftKey && e.target.closest(".wt")) e.preventDefault(); });
  list.addEventListener("dblclick", e => { const n = e.target.closest(".pj-n"); if (n) { renaming = n.dataset.fold; renderThreads($("#searchInput").value); } });
  const finishRename = commit => {
    const i = document.getElementById("pjRename"); if (!i || !renaming) return;
    if (commit && i.value.trim()) { projects[renaming].name = i.value.trim(); saveP(); }
    renaming = null; renderThreads($("#searchInput").value);
  };
  function saveNewLabel(pid) {
    if (!newName.trim()) { document.getElementById("lbNew")?.focus(); return; }
    const id = forgeLabels.add(newName, LABEL_COLORS[newColor]);
    projects[pid].label = id; saveP(); newLabelFor = null; menu = null; renderThreads($("#searchInput").value);
  }
  list.addEventListener("input", e => { if (e.target.id === "lbNew") newName = e.target.value; });
  list.addEventListener("keydown", e => {
    if (e.target.id === "lbNew") { if (e.key === "Enter") saveNewLabel(newLabelFor); if (e.key === "Escape") { newLabelFor = null; renderThreads($("#searchInput").value); } }
  });
  list.addEventListener("keydown", e => { if (e.target.id === "pjRename") { if (e.key === "Enter") finishRename(true); if (e.key === "Escape") finishRename(false); } });
  list.addEventListener("focusout", e => { if (e.target.id === "pjRename") setTimeout(() => finishRename(true), 0); });
  document.addEventListener("click", e => { if ((menu || picker) && !e.target.closest(".pj-menu, .pj-pick, [data-menu], [data-pick]")) { menu = picker = null; newLabelFor = null; renderThreads($("#searchInput").value); } });
  document.getElementById("sbGroup").onclick = () => { groupBy = groupBy === "project" ? "label" : "project"; store("forge-groupby", groupBy); renderThreads($("#searchInput").value); };
  setInterval(() => { if (!renaming && document.activeElement?.id !== "searchInput") renderThreads($("#searchInput").value); }, 60000);
  renderThreads();
})();
</script>
<script>
/* ============================================================
   COMPOSER CONTEXT — access · machine · project · branch · model.
   Every chip under the composer opens a menu and changes what the
   next session runs with. Machines can be this Mac, an SSH server,
   or an ephemeral VM created for the session.
   ============================================================ */
(() => {
  const ic = (id, cls = "") => `<svg class="${cls}"><use href="#${id}"/></svg>`;
  const esc = s => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
  const store = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

  const ACCESS = [
    { id: "full", name: "Full access", sub: "Edit files and run commands without asking", icon: "i-bolt" },
    { id: "ask", name: "Ask before edits", sub: "Approve each change and command", icon: "i-shield" },
    { id: "read", name: "Read-only", sub: "Plan and explain; no changes", icon: "i-lock" },
  ];
  const ENVS = [
    { group: "This computer", items: [{ id: "local", name: "My MacBook", sub: "macOS · 12 cores · 36 GB", icon: "i-laptop", st: "ok" }] },
    { group: "Remote servers", items: [
      { id: "devbox", name: "devbox-01", sub: "SSH · us-east-1 · 32 GB", icon: "i-server", st: "ok" },
      { id: "gpu", name: "gpu-runner", sub: "SSH · eu-west · 1× A100", icon: "i-server", st: "idle" },
      { id: "staging", name: "staging-api", sub: "SSH · offline since 2h", icon: "i-server", st: "off" },
    ] },
    { group: "Ephemeral VMs", note: "A clean machine for each session, deleted when it ends", items: [
      { id: "vm-s", name: "Ephemeral · Small", short: "VM · Small", sub: "2 vCPU · 4 GB · boots in ~8s", icon: "i-cloud", vm: true },
      { id: "vm-m", name: "Ephemeral · Medium", short: "VM · Medium", sub: "4 vCPU · 16 GB · boots in ~12s", icon: "i-cloud", vm: true },
      { id: "vm-l", name: "Ephemeral · Large", short: "VM · Large", sub: "8 vCPU · 32 GB · boots in ~20s", icon: "i-cloud", vm: true },
    ] },
  ];
  const ENV = Object.fromEntries(ENVS.flatMap(g => g.items).map(e => [e.id, e]));
  const MODELS = [
    { id: "Opus 5.5", sub: "Most capable · best for large changes" },
    { id: "Sonnet 5.5", sub: "Fast and strong · everyday work" },
    { id: "Haiku 5.5", sub: "Fastest · small edits and questions" },
    { id: "Codex", sub: "Alternative agent" },
  ];
  const EFFORT = ["Low", "Medium", "High", "Max"];

  const C = Object.assign({ access: "full", env: "local", project: "tako", branch: "main", model: "Opus 5.5", effort: "High" }, load("forge-ctx", {}));
  let vmState = null;                                    // "boot" while an ephemeral VM starts
  const save = () => store("forge-ctx", { access: C.access, env: C.env, project: C.project, branch: C.branch, model: C.model, effort: C.effort });
  window.forgeCtx = C;

  const P = () => (window.forgeProjects ? window.forgeProjects() : { tako: { name: "tako", icon: "octo" } });
  const pix = id => (window.forgePix ? window.forgePix(id) : "");
  const thread = () => threads.find(t => t.id === activeId);
  const proj = () => (view === "home" ? C.project : thread()?.repo || C.project);
  const branch = () => (view === "home" ? C.branch : thread()?.branch || C.branch);

  /* ---------- chips ---------- */
  const foot = document.querySelector(".composer-foot");
  const [accessChip, envChip] = foot.querySelectorAll(".chip");
  accessChip.id = "ctxAccess"; envChip.id = "ctxEnv";
  const modelChip = foot.querySelector(".chip:has(.spark)"); modelChip.id = "ctxModel";
  const chips = { access: accessChip, env: envChip, project: document.getElementById("ctxRepo"), branch: document.getElementById("ctxBranch"), model: modelChip };
  function syncChips() {
    const a = ACCESS.find(x => x.id === C.access), e = ENV[C.env] || ENV.local, p = P()[proj()] || { name: proj(), icon: "star" };
    chips.access.innerHTML = `${ic(a.icon)}${a.name}`;
    chips.env.innerHTML = `${ic(e.icon)}${esc(e.short || e.name)}${vmState === "boot" ? '<span class="spinner"></span>' : e.vm ? '<i class="env-dot ok"></i>' : ""}`;
    chips.project.innerHTML = `${pix(p.icon)}${esc(p.name)}`;
    chips.branch.innerHTML = `${ic("i-branch")}${esc(branch())}`;
    chips.model.innerHTML = `<svg class="spark"><use href="#i-spark"/></svg><b>${esc(C.model)}</b><span class="faint">${esc(C.effort)}</span>`;
    Object.entries(chips).forEach(([k, el]) => { el.dataset.ctx = k; el.classList.toggle("open", openKey === k); });
  }
  const feedPrev = renderFeed;
  renderFeed = function () { feedPrev(); syncChips(); window.forgeOnCtx?.(); };

  /* ---------- popover ---------- */
  const pop = document.createElement("div"); pop.className = "ctx-pop"; pop.id = "ctxPop"; document.body.appendChild(pop);
  let openKey = null, q = "";
  const row = (attrs, icon, name, sub, on, extra = "") => `<button class="cp-row ${on ? "on" : ""}" ${attrs}>${icon}<span class="cp-t"><b>${name}</b>${sub ? `<small>${sub}</small>` : ""}</span>${extra}${on ? ic("i-check", "cp-ck") : ""}</button>`;
  function body() {
    if (openKey === "access") return `<div class="cp-h">Permissions</div>` + ACCESS.map(a => row(`data-set="access" data-v="${a.id}"`, ic(a.icon, "cp-i"), a.name, a.sub, C.access === a.id)).join("");
    if (openKey === "env") return ENVS.map(g => `<div class="cp-h">${g.group}</div>${g.note ? `<div class="cp-note">${g.note}</div>` : ""}` + g.items.map(e =>
      row(`data-set="env" data-v="${e.id}" ${e.st === "off" ? "disabled" : ""}`, ic(e.icon, "cp-i"), e.name, e.sub, C.env === e.id, e.st ? `<i class="env-dot ${e.st}" title="${{ ok: "Online", idle: "Idle", off: "Offline" }[e.st]}"></i>` : "")).join("")).join("") +
      `<div class="cp-foot"><button data-act="ssh">${ic("i-plus")}Add SSH server</button><button data-act="envs">Manage machines</button></div>`;
    if (openKey === "project") {
      const all = Object.entries(P()).filter(([k, p]) => !q || p.name.toLowerCase().includes(q.toLowerCase()));
      const n = k => threads.filter(t => t.repo === k).length;
      return `<label class="cp-search">${ic("i-search")}<input id="cpQ" placeholder="Switch project" value="${esc(q)}" spellcheck="false"/></label>` +
        (all.map(([k, p]) => row(`data-set="project" data-v="${k}"`, `<span class="cp-pix">${pix(p.icon)}</span>`, esc(p.name), `${n(k)} worktree${n(k) === 1 ? "" : "s"}`, proj() === k)).join("") || `<div class="cp-empty">No projects match</div>`) +
        `<div class="cp-foot"><button data-act="open">${ic("i-folder")}Open folder…</button><button data-act="clone">${ic("i-github")}Clone repository…</button></div>`;
    }
    if (openKey === "branch") {
      const p = proj(), base = ["main", "develop", "release/2.4"], mine = threads.filter(t => t.repo === p).map(t => t.branch);
      const all = [...new Set([...base, ...mine])].filter(b => !q || b.toLowerCase().includes(q.toLowerCase()));
      const exact = all.includes(q.trim());
      return `<label class="cp-search">${ic("i-search")}<input id="cpQ" placeholder="Find or create a branch" value="${esc(q)}" spellcheck="false"/></label>` +
        (q.trim() && !exact ? row(`data-set="branch" data-v="${esc(q.trim())}" data-new="1"`, ic("i-plus", "cp-i"), `Create <code>${esc(q.trim())}</code>`, `from ${esc(branch())}`, false) : "") +
        `<div class="cp-list">${all.map(b => row(`data-set="branch" data-v="${esc(b)}"`, ic("i-branch", "cp-i"), `<code>${esc(b)}</code>`, b === "main" ? "default" : "", branch() === b)).join("")}</div>`;
    }
    if (openKey === "model") return `<div class="cp-h">Model</div>` + MODELS.map(m => row(`data-set="model" data-v="${m.id}"`, `<svg class="spark cp-i"><use href="#i-spark"/></svg>`, m.id, m.sub, C.model === m.id)).join("") +
      `<div class="cp-h">Effort</div><div class="cp-seg">${EFFORT.map(e => `<button class="${C.effort === e ? "on" : ""}" data-set="effort" data-v="${e}">${e}</button>`).join("")}</div>`;
    return "";
  }
  function place() {
    const r = chips[openKey].getBoundingClientRect(), w = pop.offsetWidth, h = pop.offsetHeight;
    pop.style.left = Math.max(8, Math.min(innerWidth - w - 8, r.left)) + "px";
    pop.style.top = (r.top - h - 8 > 8 ? r.top - h - 8 : Math.min(innerHeight - h - 8, r.bottom + 8)) + "px";
  }
  function openPop(k) {
    openKey = openKey === k ? null : k; q = "";
    if (!openKey) return close();
    pop.className = "ctx-pop open k-" + openKey; pop.innerHTML = body(); place(); syncChips();
    document.getElementById("cpQ")?.focus();
  }
  function close() { openKey = null; pop.className = "ctx-pop"; syncChips(); }
  function refresh() { pop.innerHTML = body(); place(); const i = document.getElementById("cpQ"); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }

  foot.addEventListener("click", e => { const c = e.target.closest("[data-ctx]"); if (c) { e.stopPropagation(); openPop(c.dataset.ctx); } });
  pop.addEventListener("input", e => { if (e.target.id === "cpQ") { q = e.target.value; refresh(); } });
  pop.addEventListener("keydown", e => {
    if (e.target.id !== "cpQ") return;
    if (e.key === "Enter") { const first = pop.querySelector(".cp-row:not([disabled])"); first?.click(); }
  });
  pop.addEventListener("click", e => {
    e.stopPropagation();
    const b = e.target.closest("[data-set]"), act = e.target.closest("[data-act]");
    if (act) { toast({ ssh: "SSH setup would open here", envs: "Machine settings would open here", open: "A folder picker would open here", clone: "Clone from URL would open here" }[act.dataset.act]); return close(); }
    if (!b || b.disabled) return;
    const k = b.dataset.set, v = b.dataset.v;
    if (k === "effort") { C.effort = v; save(); syncChips(); return refresh(); }
    if (k === "project") {
      if (view === "home") { C.project = v; C.branch = "main"; }
      else { const t = threads.filter(x => x.repo === v).sort((a, b) => (b.last || 0) - (a.last || 0))[0]; if (t) openThread(t.id); else { C.project = v; C.branch = "main"; goHome(); } }
    }
    if (k === "branch") { if (view === "home") C.branch = v; else { thread().branch = v; renderThreads(document.getElementById("searchInput").value); renderPanel(); } if (b.dataset.new) toast(`Created branch ${v}`); }
    if (k === "env") {
      C.env = v;
      if (ENV[v].vm) { vmState = "boot"; setTimeout(() => { vmState = null; syncChips(); toast(`${ENV[v].name} is ready`); }, 1800); }
    }
    if (k === "access" || k === "model") C[k] = v;
    save(); close(); syncChips(); window.forgeOnCtx?.();
  });
  document.addEventListener("click", () => openKey && close());
  document.addEventListener("keydown", e => { if (e.key === "Escape" && openKey) close(); });
  addEventListener("resize", () => openKey && place());

  function toast(msg) {
    const t = document.createElement("div"); t.className = "ctx-toast"; t.textContent = msg; document.body.appendChild(t);
    requestAnimationFrame(() => t.classList.add("in")); setTimeout(() => { t.classList.remove("in"); setTimeout(() => t.remove(), 300); }, 1800);
  }


  syncChips();
})();
</script>
<script>
/* ============================================================
   HOME STATS — a compact panel under the composer: PR counts and
   a GitHub-style year of activity for the selected project.
   ============================================================ */
(() => {
  const el = document.getElementById("homeStats");
  const esc = s => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;");
  const hash = s => [...s].reduce((h, c) => Math.imul(h ^ c.charCodeAt(0), 16777619), 2166136261) >>> 0;
  const rng = s => () => ((s = Math.imul(s ^ (s >>> 15), 1 | s) + 0x6d2b79f5 | 0) >>> 0) / 4294967296;
  const fmtDay = d => d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
  const cache = {};

  function data(pid) {
    if (cache[pid]) return cache[pid];
    const r = rng(hash(pid)), busy = 0.5 + r() * 0.9, today = new Date(); today.setHours(0, 0, 0, 0);
    const start = new Date(today); start.setDate(start.getDate() - 52 * 7 - today.getDay() + 1);  // 53 columns, weeks start Sunday
    const days = [];
    for (let d = new Date(start), i = 0; d <= today; d.setDate(d.getDate() + 1), i++) {
      const weekend = d.getDay() === 0 || d.getDay() === 6, ramp = 0.45 + (i / 371) * 0.8, x = r();
      days.push({ date: new Date(d), n: x < (weekend ? 0.7 : 0.22) ? 0 : Math.round(x * 4.2 * busy * ramp * (weekend ? 0.4 : 1)) });
    }
    const raised = days.reduce((a, b) => a + b.n, 0);
    const open = threads.filter(t => t.repo === pid && (t.prState === "open" || t.prState === "draft")).length || Math.round(2 + r() * 6);
    const merged = Math.round((raised - open) * (0.84 + r() * 0.1)), closed = Math.max(0, raised - open - merged);

  }

  let lastKey = "", shown = { raised: 0, merged: 0, open: 0, closed: 0 };
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  function countTo(to) {
    const from = { ...shown }, t0 = performance.now(), dur = 0;
    const step = now => {
      const k = dur ? Math.min(1, (now - t0) / dur) : 1, e = 1 - Math.pow(1 - k, 3);
      Object.keys(to).forEach(key => { const v = Math.round(from[key] + (to[key] - from[key]) * e), b = el.querySelector(`[data-k="${key}"]`); if (b) b.textContent = v; });
      if (k < 1) requestAnimationFrame(step); else shown = { ...to };
    };
    requestAnimationFrame(step);
  }
  function render() {
    const pid = window.forgeCtx?.project || "tako", P = window.forgeProjects ? window.forgeProjects() : {}, p = P[pid] || { name: pid, icon: "star" };
    const key = pid + "|" + p.name + "|" + p.icon;
    if (key === lastKey) return;                       // only redraw (and replay the reveal) when the project changes
    lastKey = key;
    const D = data(pid), max = Math.max(1, ...D.days.map(d => d.n));
    const lvl = n => (n ? Math.min(4, Math.ceil((n / max) * 4)) : 0);
    // month labels at the first column that starts in a new month
    const months = []; let prev = -1;
    for (let c = 0; c * 7 < D.days.length; c++) { const m = D.days[c * 7].date.getMonth(); if (m !== prev) { months.push([c, D.days[c * 7].date.toLocaleDateString(undefined, { month: "short" })]); prev = m; } }
    el.innerHTML = `
      <div class="hs-top">
        <span class="hs-p">${window.forgePix ? forgePix(p.icon) : ""}<b>${esc(p.name)}</b><span>· last 12 months</span></span>
        <span class="hs-n"><span><b data-k="raised">${shown.raised}</b>raised</span><span><b data-k="merged">${shown.merged}</b>merged</span><span><b data-k="open">${shown.open}</b>open</span><span><b data-k="closed">${shown.closed}</b>closed</span></span>
      </div>
      <div class="hs-mo">${months.filter(([c], i) => !months[i + 1] || months[i + 1][0] - c >= 3).map(([c, m]) => `<span style="--c:${c}">${m}</span>`).join("")}</div>
      <div class="hs-grid">${D.days.map((d, i) => `<i class="l${lvl(d.n)}${i === D.days.length - 1 ? " today" : ""}" style="--d:${Math.floor(i / 7)}" title="${d.n ? `${d.n} PR${d.n > 1 ? "s" : ""}` : "No PRs"} · ${fmtDay(d.date)}${i === D.days.length - 1 ? " (today)" : ""}"></i>`).join("")}</div>
      <div class="hs-leg">Less<i class="l0"></i><i class="l1"></i><i class="l2"></i><i class="l3"></i><i class="l4"></i>More</div>`;
    countTo({ raised: D.raised, merged: D.merged, open: D.open, closed: D.closed });
  }
  window.forgeOnCtx = render;
  render();
})();

          <div class="ss-tile"><span class="ss-ic">${ic("i-stars")}</span><div><b>${fmtN(tot)}</b><small>Total tokens</small></div></div>
          <div class="ss-tile"><span class="ss-ic">${ic("i-coin")}</span><div><b>${fmt$(cost)}</b><small>Est. cost</small></div></div>
          <div class="ss-tile"><span class="ss-ic">${ic("i-cal")}</span><div><b>${active}<span style="font-size:13px;color:var(--text-3);font-weight:400"> / ${n}</span></b><small>Active days</small></div></div>
          <div class="ss-tile"><span class="ss-ic">${ic("i-db")}</span><div><b>${Math.round(cacheShare * 100)}%</b><small>Cache share</small></div></div>
        </div>
        <div class="ss-grid">
          <div class="ss-box">
            <div class="ss-bh"><div><h4>Daily intensity</h4><p>Tokens per day, last ${weeks} weeks</p></div><span class="ss-pill">Best · <b>${fmtD(best.d)}</b></span></div>
            <div class="ss-hm">${cells}</div>
            <div class="ss-hmf"><span>${fmtD(start)}</span><span class="ss-leg">Less <i style="background:color-mix(in srgb,var(--text) 6%,transparent)"></i><i style="background:color-mix(in srgb,var(--accent) 28%,transparent)"></i><i style="background:color-mix(in srgb,var(--accent) 50%,transparent)"></i><i style="background:color-mix(in srgb,var(--accent) 76%,transparent)"></i><i style="background:var(--accent)"></i> More</span><span>${fmtD(end)}</span></div>
          </div>
          <div class="ss-box">
            <div class="ss-bh"><div><h4>Token mix</h4><p>Input, output and cache over ${range === "all" ? "all time" : `the last ${n} days`}</p></div>${sum("rs") ? `<span class="ss-pill"><b>${fmtN(sum("rs"))}</b> reasoning</span>` : ""}</div>
            <div class="ss-mix">${MIX.map(([l, v, c]) => `<i style="flex:${v} 1 0;background:${c}" title="${l}"></i>`).join("")}</div>
            <div class="ss-mixl">${MIX.map(([l, v, c]) => `<div><i style="background:${c}"></i>${l}<b>${fmtN(v)}</b><small>${tot ? Math.round(v / tot * 100) : 0}%</small></div>`).join("")}</div>
          </div>
        </div>
        <div class="ss-row2">
          <div class="ss-box"><h4>Models</h4><p>Share of tokens by model</p>
            <div class="ss-bars">${models.map(([m, v, p]) => `<div class="ss-bar"><span>${pv(p)}${m}</span><em>${fmtN(v)}</em><div class="tr"><i style="width:${v / mMax * 100}%;background:${p === "claude" ? "#d97757" : "#5b7cfa"}"></i></div></div>`).join("")}</div></div>
          <div class="ss-box"><h4>Projects</h4><p>Where the tokens went</p>
            <div class="ss-bars">${pj.map(([name, v, icon]) => `<div class="ss-bar"><span><span class="pi">${pix(icon)}</span>${esc(name)}</span><em>${fmtN(v)}</em><div class="tr"><i style="width:${v / pMax * 100}%"></i></div></div>`).join("")}</div></div>
        </div>
        <div class="ss-fun">
          <div class="ss-box"><span class="em">🔥</span><div><b>${cur}-day streak</b><small>Longest: ${longest} days</small></div></div>
          <div class="ss-box"><span class="em">🐙</span><div><b>${Math.min(8, Math.max(3, Math.round(peak / 6)))} arms at once</b><small>Most agents running together</small></div></div>
          <div class="ss-box"><span class="em">💸</span><div><b>${fmt$(cost * cacheShare * 8.5)} saved</b><small>by cache hits ${range === "all" ? "overall" : `in ${n} days`}</small></div></div>
        </div>
        <div class="ss-note">${ic("i-shield")}Costs are estimates from public API prices. Plan usage isn't billed per token.</div>
      </div>
    </div>`;
  }
  // tooltip
  const tip = document.createElement("div"); tip.className = "ss-tip"; document.body.appendChild(tip);
  page.addEventListener("mouseover", e => {
    const c = e.target.closest("[data-tip]"); if (!c) return tip.classList.remove("on");
    const [d, v, $c] = c.dataset.tip.split("|"); tip.innerHTML = `<b>${d}</b><small>${v}${$c ? " · " + $c : ""}</small>`;
    const r = c.getBoundingClientRect(); tip.classList.add("on");
    tip.style.left = Math.min(innerWidth - tip.offsetWidth - 8, r.left + r.width / 2 - tip.offsetWidth / 2) + "px"; tip.style.top = r.top - tip.offsetHeight - 8 + "px";
  });
  page.addEventListener("mouseleave", () => tip.classList.remove("on"));
  page.addEventListener("scroll", () => tip.classList.remove("on"));
  page.addEventListener("click", e => {
    const t = e.target.closest("[data-range],[data-scope],[data-sel],[data-ref]");
    if (!t) { if (selOpen) { selOpen = false; paint(); } return; }
    if (t.dataset.range) range = t.dataset.range;
    if (t.dataset.scope) { scope = t.dataset.scope; selOpen = false; }
    if (t.hasAttribute("data-sel")) selOpen = !selOpen;
    if (t.hasAttribute("data-ref")) { t.classList.add("spin"); setTimeout(paint, 650); return; }
    paint();
  });
  window.forgeUsage?.onChange(() => { for (const k in cache) delete cache[k]; if (document.getElementById("app").dataset.view === "stats") paint(); });

  // keep avatar ring in sync with the page
  const app = document.getElementById("app");
  new MutationObserver(() => avatar.classList.toggle("on", app.dataset.view === "stats")).observe(app, { attributes: true, attributeFilter: ["data-view"] });

  // ---------- sign out ----------
  const so = document.createElement("div"); so.className = "so";
  so.innerHTML = `<canvas></canvas><div class="so-card"><h1>See you soon.</h1><p>You're signed out. Tako is taking a nap.</p>
    <div class="row"><button class="p" data-in>${ic("i-github")}Sign in with GitHub</button><button class="s" data-in>Use email instead</button></div>
    <small>Your worktrees and chats stay on this Mac.</small></div>`;
  document.body.appendChild(so);
  const cv = so.querySelector("canvas"), g = cv.getContext("2d");
  let raf = 0, t0 = 0;
  const bubbles = [];
  function frame(now) {
    const S = 4, W = Math.ceil(innerWidth / S), H = Math.ceil(innerHeight / S);
    if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
    const t = (now - t0) / 1000;
    const gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, "#0a2a6e"); gr.addColorStop(.55, "#061a4a"); gr.addColorStop(1, "#030a22");
    g.fillStyle = gr; g.fillRect(0, 0, W, H);
    // light rays
    g.globalAlpha = .07; g.fillStyle = "#9cc8ff";
    for (let k = 0; k < 5; k++) { const x = W * (.15 + k * .19) + Math.sin(t * .3 + k) * 6; g.beginPath(); g.moveTo(x, 0); g.lineTo(x + 10, 0); g.lineTo(x + 40 + k * 4, H); g.lineTo(x + 18, H); g.fill(); }
    g.globalAlpha = 1;
    // plankton
    for (let k = 0; k < 60; k++) { const x = (k * 97.3 + t * (1 + k % 3)) % W, y = (k * 53.7 + Math.sin(t * .5 + k) * 4) % H; g.fillStyle = k % 4 ? "rgba(140,190,255,.35)" : "rgba(180,240,255,.7)"; g.fillRect(x | 0, y | 0, 1, 1); }
    // sand
    g.fillStyle = "#0b2156"; for (let x = 0; x < W; x++) { const y = H - 10 - Math.sin(x * .05) * 3 - Math.sin(x * .13) * 1.5; g.fillRect(x, y | 0, 1, H); }
    // sleeping Tako
    const ox = W / 2, oy = H * .5 - 52 + Math.sin(t * 1.1) * 2;
    window.TakoOcto?.draw(g, { x: ox, y: oy, t: t * .6, lid: 1, pose: "float", ripple: .2 + .2 * Math.sin(t * .8) });
    // Zz bubbles
    if (Math.random() < .025) bubbles.push({ x: ox + 12, y: oy - 18, a: 0, z: Math.random() < .5 });
    bubbles.forEach(b => { b.a += 1 / 60; b.y -= .25; b.x += Math.sin(b.a * 3) * .3; });
    while (bubbles.length && bubbles[0].a > 4) bubbles.shift();
    bubbles.forEach(b => {
      g.globalAlpha = Math.max(0, 1 - b.a / 4); g.fillStyle = "#cfe3ff";
      if (b.z) { const x = b.x | 0, y = b.y | 0; g.fillRect(x, y, 4, 1); g.fillRect(x + 2, y + 1, 1, 1); g.fillRect(x + 1, y + 2, 1, 1); g.fillRect(x, y + 3, 4, 1); }
      else { g.strokeStyle = "#9cc8ff"; g.lineWidth = 1; g.beginPath(); g.arc(b.x, b.y, 1.6 + b.a * .4, 0, Math.PI * 2); g.stroke(); }
    });
    g.globalAlpha = 1;
    raf = requestAnimationFrame(frame);
  }
  function signOut() { so.classList.add("on"); t0 = performance.now(); cancelAnimationFrame(raf); raf = requestAnimationFrame(frame); }
  so.addEventListener("click", e => {
    if (!e.target.closest("[data-in]")) return;
    so.classList.remove("on"); setTimeout(() => cancelAnimationFrame(raf), 500);
  });
  window.forgeProfile = { openStats, signOut };
})();
</script>
</body>
</html>
